# Einstellungsseite plus Websocket zum Broker unter einem Hostnamen. Nötig, sobald die Seite über den
# Cloudflare-Tunnel läuft: dort gibt es nur 443, und ws:// wäre auf einer https-Seite Mixed Content.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Exakter Pfad, kein Präfix: sonst schluckt diese Regel auch /mqtt.min.js, und die Seite
    # bekommt ihre MQTT-Bibliothek nicht mehr.
    location = /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;   # der Broker schickt lange nichts, die Verbindung muss trotzdem stehen bleiben
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
