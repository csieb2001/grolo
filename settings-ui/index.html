<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GroLo · Growatt Local</title>
<style>
  :root { --bg:#111217; --panel:#181b1f; --line:#2c3235; --text:#d8d9da; --muted:#8e8e8e;
          --accent:#f2cc0c; --green:#73bf69; --orange:#ff9830; --red:#f2495c; --blue:#5794f2; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
  header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5 }
  header h1 { font-size:18px; margin:0; font-weight:700; letter-spacing:.02em } header h1 small { color:var(--muted); font-weight:400; font-size:12px; margin-left:6px }
  header .spacer { flex:1 }
  .pill { padding:3px 10px; border-radius:12px; font-size:12px; background:#26292d; color:var(--muted) }
  .pill.ok { background:#1f3a24; color:var(--green) } .pill.bad { background:#3f1e22; color:var(--red) } .pill.warn { background:#3f3018; color:var(--orange) }
  main { max-width:1200px; margin:0 auto; padding:18px 20px 60px; display:grid; gap:18px }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px }
  section h2 { margin:0 0 4px; font-size:15px; font-weight:600 }
  section h3 { margin:14px 0 6px; font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em }
  section p.hint { margin:0 0 12px; color:var(--muted); font-size:12.5px }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:10px }
  .ctl { border:1px solid var(--line); border-radius:6px; padding:10px 12px; display:grid; gap:6px; background:#1c1f24 }
  .ctl .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px }
  .ctl label { font-weight:600; font-size:13px }
  .cur { font-variant-numeric:tabular-nums; color:var(--accent); font-weight:600; white-space:nowrap }
  .cur.pending { color:var(--orange) } .cur.unknown { color:var(--muted); font-weight:400 }
  #advice .item { border-left:3px solid var(--line); background:#1c1f24; border-radius:4px; padding:8px 12px; margin-bottom:8px; font-size:12.5px; line-height:1.5; color:var(--text) }
  #advice .lever { margin-left:10px; padding:1px 8px; border-radius:10px; background:#26292d; color:var(--accent); font-weight:600; font-size:12px }
  #site-cur { white-space:normal; text-align:right; font-size:12.5px; overflow-wrap:anywhere }
  #sec-site .ctl { min-width:0 } #sec-site .row input[type=text] { min-width:120px }
  #site-strings td.az { display:flex; gap:4px; align-items:center } #site-strings td.az input { flex:1 1 60px; min-width:60px } #site-strings td.az select { flex:0 0 auto; width:auto; padding:4px 4px }
  .ctl .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap }
  .desc, .muted { color:var(--muted); font-size:12px }
  input[type=number], input[type=time], input[type=text], select, textarea {
    flex:1; min-width:0; background:#0f1114; color:var(--text); border:1px solid #3a4046; border-radius:4px; padding:6px 8px; font-size:14px }
  textarea { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; line-height:1.5; resize:vertical; width:100% }
  input[type=range] { flex:1; accent-color:var(--accent) }
  .ctl .row input[type=number] { flex:0 0 auto; width:76px; min-width:76px }
  button { background:#2f3540; color:var(--text); border:1px solid #444b54; border-radius:4px; padding:6px 12px; font-size:13px; cursor:pointer; white-space:nowrap }
  button:hover { background:#3a414d } button.primary { background:#3d5a80; border-color:#4a6d9a } button.primary:hover { background:#476a96 }
  button.danger { background:#5a2a2f; border-color:#7a3a41 }
  .toggle { display:inline-flex; border:1px solid #444b54; border-radius:4px; overflow:hidden }
  .toggle button { border:0; border-radius:0; padding:6px 14px } .toggle button.on { background:var(--green); color:#111 } .toggle button.off { background:var(--red); color:#111 }
  .toggle.lang button.on { background:var(--blue); color:#fff }
  table { width:100%; border-collapse:collapse; font-size:13px }
  th, td { padding:6px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle }
  th { color:var(--muted); font-weight:600; font-size:12px }
  td input, td select { width:100%; padding:4px 6px; font-size:13px }
  td.slotno { font-weight:600 }
  .tablewrap { overflow-x:auto }
  /* Zahlen mit Einheit gehören in eine Zeile – „21,5 °C" über zwei Zeilen liest sich wie zwei Werte. */
  table.rooms td, table.rooms th { white-space:nowrap }
  table.rooms td.sub { white-space:normal }
  table.rooms .stepper { display:flex; gap:4px; align-items:center }
  table.rooms .stepper button { padding:2px 8px; font-size:13px; line-height:1.3; min-width:28px }
  table.rooms .stepper input { width:64px; min-width:64px; text-align:center }
  .info { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px }
  .kv { background:#1c1f24; border:1px solid var(--line); border-radius:6px; padding:8px 10px }
  .kv .k { color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em }
  .kv .v { font-size:15px; font-weight:600; margin-top:2px; word-break:break-all } .kv .v.small { font-size:12.5px; font-weight:400 }
  #log { font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; max-height:240px; overflow:auto; background:#0f1114; border:1px solid var(--line); border-radius:4px; padding:8px 10px; color:#b5b8bc; white-space:pre-wrap }
  .log-ok { color:var(--green) } .log-err { color:var(--red) } .log-tx { color:var(--blue) } .log-cloud { color:#c084fc } .log-info { color:#9aa0a6 }
  a { color:var(--blue) }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 20px 30px }
  nav.nav { display:flex; gap:14px; flex-wrap:wrap }
  nav.nav a { color:var(--muted); text-decoration:none; font-size:13px; border-bottom:1px solid transparent }
  nav.nav a:hover { color:var(--text); border-bottom-color:var(--line) }
  @media (max-width:700px) { header { padding:10px 12px } main { padding:12px } }
  .slab { color:#8e8e8e; font-size:11px; align-self:center; margin-left:4px }
  .srow { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end }
  .sfield { display:flex; flex-direction:column; gap:2px }
  .sfield .slab { margin:0; font-size:11px }
  .sfield input { width:88px; padding:5px 6px }
  .sgrid { display:flex; flex-wrap:wrap; gap:14px 18px; margin-top:2px }
  .scell { display:flex; flex-direction:column; gap:1px }
  .scell .sl { color:#8e8e8e; font-size:11px; text-transform:uppercase; letter-spacing:.03em }
  .scell .sv { font-size:19px; font-weight:600; font-variant-numeric:tabular-nums }
</style>
</head>
<body>
<header>
  <h1>GroLo <small>Growatt Local · 2026.40.3</small></h1>
  <span id="conn" class="pill">…</span>
  <span id="dev" class="pill">–</span>
  <span id="avail" class="pill">–</span>
  <span class="spacer"></span>
  <div class="toggle lang" id="lang"><button data-lang="en">EN</button><button data-lang="de">DE</button></div>
  <button id="readall" class="primary"></button>
  <nav id="nav" class="nav"></nav>
</header>

<main>
  <section id="sec-device"><h2 data-t="sec.device"></h2><p class="hint" data-t="sec.device.hint"></p>
    <div class="info" id="dev-info"></div>
    <h3 data-t="packs.title"></h3>
    <div class="tablewrap"><table><thead><tr><th data-t="packs.pack"></th><th>SoC</th><th data-t="packs.temp"></th><th data-t="packs.cells"></th><th data-t="packs.cycles"></th><th data-t="packs.soh"></th></tr></thead><tbody id="packs"></tbody></table></div>
    <h3 data-t="dongle.title"></h3><div class="info" id="dongle-info"><span class="muted" data-t="dongle.waiting"></span></div>
  </section>

  <section id="sec-mode"><h2 data-t="sec.mode"></h2><p class="hint" data-t="sec.mode.hint"></p><div class="grid" id="mode-who"></div><div class="grid" id="mode-grid" style="margin-top:10px"></div></section>
  <section id="sec-shelly"><h2 data-t="sec.shelly"></h2><p class="hint" data-t="sec.shelly.hint"></p>
    <div class="grid">
      <div class="ctl">
        <div class="top"><label data-t="shelly.enabled"></label><span class="cur unknown" id="shelly-badge">–</span></div>
        <div class="desc" data-t="shelly.enabled.desc"></div>
        <div class="row"><div class="toggle" id="shelly-toggle"><button class="b-on" id="shelly-on" data-t="on"></button><button class="b-off" id="shelly-off" data-t="off"></button></div></div>
      </div>
      <div class="ctl">
        <div class="top"><label data-t="shelly.host"></label></div>
        <div class="desc" data-t="shelly.host.desc"></div>
        <div class="row"><input type="text" id="shelly-host" placeholder="192.168.1.158" style="flex:1;min-width:120px"><button class="primary" id="shelly-host-save" data-t="set"></button></div>
      </div>
      <div class="ctl">
        <div class="top"><label data-t="shelly.tuning"></label></div>
        <div class="desc" data-t="shelly.tuning.desc"></div>
        <div class="srow">
          <span class="sfield"><label class="slab" data-t="shelly.setpoint"></label><input type="number" id="shelly-setpoint" inputmode="numeric"></span>
          <span class="sfield"><label class="slab" data-t="shelly.min"></label><input type="number" id="shelly-min" inputmode="numeric"></span>
          <span class="sfield"><label class="slab" data-t="shelly.max"></label><input type="number" id="shelly-max" inputmode="numeric"></span>
          <button class="primary" id="shelly-save" data-t="set"></button>
        </div>
      </div>
      <div class="ctl">
        <div class="top"><label data-t="shelly.hold"></label></div>
        <div class="desc" data-t="shelly.hold.desc"></div>
        <div class="srow">
          <span class="sfield"><label class="slab" data-t="shelly.holdw"></label><input type="number" id="shelly-holdw" inputmode="numeric" min="10" step="10"></span>
          <span class="sfield"><label class="slab" data-t="shelly.holds"></label><input type="number" id="shelly-holds" inputmode="numeric" min="5" step="5"></span>
          <span class="sfield"><label class="slab" data-t="shelly.writes"></label><input type="number" id="shelly-writes" inputmode="numeric" min="2" step="1"></span>
          <span class="sfield"><label class="slab" data-t="shelly.exportw"></label><input type="number" id="shelly-exportw" inputmode="numeric" min="5" step="5"></span>
          <button class="primary" id="shelly-hold-save" data-t="set"></button>
        </div>
      </div>
      <div class="ctl">
        <div class="top"><label data-t="shelly.live"></label><span class="cur unknown" id="shelly-live-badge">–</span></div>
        <div id="shelly-live" class="sgrid"><span class="muted">–</span></div>
      </div>
    </div>
  </section>
  <section id="sec-battery"><h2 data-t="sec.battery"></h2><p class="hint" data-t="sec.battery.hint"></p><div class="grid"></div></section>
  <section id="sec-output"><h2 data-t="sec.output"></h2><p class="hint" data-t="sec.output.hint"></p><div class="grid"></div></section>
  <section id="sec-slots"><h2 data-t="sec.slots"></h2><p class="hint" data-t="sec.slots.hint"></p>
    <div class="tablewrap"><table><thead><tr><th>Slot</th><th data-t="slots.active"></th><th data-t="slots.start"></th><th data-t="slots.end"></th><th data-t="slots.mode"></th><th data-t="slots.power"></th><th></th></tr></thead><tbody id="slots"></tbody></table></div>
  </section>
  <section id="sec-site"><h2 data-t="sec.site"></h2><p class="hint" data-t="sec.site.hint"></p>
    <div class="grid">
      <div class="ctl"><div class="top"><label data-t="site.place"></label><span class="cur unknown" id="site-cur">–</span></div>
        <div class="desc" data-t="site.place.desc"></div>
        <div class="row"><input type="text" id="site-q" placeholder="25421 Pinneberg"><button id="site-search" data-t="site.search"></button></div>
        <div class="row"><select id="site-results" hidden></select></div>
        <div class="row"><span class="muted" style="min-width:60px" data-t="site.coords"></span><input type="number" id="site-lat" step="0.0001" min="-90" max="90" placeholder="53.66"><input type="number" id="site-lon" step="0.0001" min="-180" max="180" placeholder="9.80"></div>
      </div>
      <div class="ctl"><div class="top"><label data-t="site.sun"></label></div><div class="desc" id="site-sun" data-t="site.sun.waiting"></div></div>
    </div>
    <h3 data-t="site.strings"></h3><p class="hint" data-t="site.strings.hint"></p>
    <div class="tablewrap"><table><thead><tr><th>String</th><th data-t="site.name"></th><th data-t="site.tilt"></th><th data-t="site.azimuth"></th><th data-t="site.wp"></th><th data-t="site.now"></th><th data-t="site.fit"></th></tr></thead><tbody id="site-strings"></tbody></table></div>
    <h3 data-t="hz.title"></h3><p class="hint" data-t="hz.hint"></p>
    <div class="row"><textarea id="site-horizon" rows="6" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea></div>
    <div class="muted" id="hz-status"></div>
    <div class="row" style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button id="site-save" class="primary" data-t="site.save"></button><span class="muted" id="site-status"></span>
      <span class="spacer"></span><button id="fit-run" data-t="fit.run"></button><span class="muted" id="fit-status" data-t="fit.none"></span></div>
    <h3 data-t="adv.title"></h3><p class="hint" data-t="adv.hint"></p>
    <div id="advice" class="muted" data-t="adv.none"></div>
  </section>
  <section id="sec-tariff"><h2 data-t="sec.tariff"></h2><p class="hint" data-t="sec.tariff.hint"></p>
    <div class="grid">
      <div class="ctl">
        <div class="top"><label data-t="tariff.price"></label><span class="cur unknown" id="tariff-cur">–</span></div>
        <div class="desc" data-t="tariff.price.desc"></div>
        <div class="srow">
          <span class="sfield"><label class="slab" data-t="tariff.price.short"></label><input type="number" id="tariff-price" step="0.1" min="0" inputmode="decimal" placeholder="30"></span>
          <span class="sfield"><label class="slab" data-t="tariff.feedin"></label><input type="number" id="tariff-feedin" step="0.1" min="0" inputmode="decimal" placeholder="0"></span>
          <span class="sfield"><label class="slab" data-t="tariff.cost"></label><input type="number" id="tariff-cost" step="1" min="0" inputmode="numeric" placeholder="0"></span>
          <span class="sfield"><label class="slab" data-t="tariff.base"></label><input type="number" id="tariff-base" step="0.5" min="0" inputmode="decimal" placeholder="12"></span>
          <span class="sfield"><label class="slab" data-t="tariff.abschlag"></label><input type="number" id="tariff-abschlag" step="1" min="0" inputmode="numeric" placeholder="–"></span>
          <!-- Gaspreis: der Maßstab für „was hätte die alte Gasheizung gekostet". Er steht hier und nicht
               beim Haus, weil alle Arbeitspreise an einer Stelle gepflegt werden sollen. Leer greift die
               Vorgabe 11 ct (Marktmittel Neukunden), ein eigener Eintrag schlägt sie – wie beim Strompreis,
               wo 30 ct im placeholder stehen. Der Grundpreis bleibt leer: er schwankt zwischen den
               Anbietern zu stark, um ihn zu raten, und ohne Eintrag fällt er aus der Rechnung. -->
          <span class="sfield"><label class="slab" data-t="tariff.gas"></label><input type="number" id="tariff-gas" step="0.1" min="0" inputmode="decimal" placeholder="11"></span>
          <span class="sfield"><label class="slab" data-t="tariff.gasbase"></label><input type="number" id="tariff-gasbase" step="0.5" min="0" inputmode="decimal" placeholder="–"></span>
          <button class="primary" id="tariff-save" data-t="set"></button>
        </div>
        <div class="muted" id="tariff-status"></div>
      </div>
      <div class="ctl">
        <div class="top"><label data-t="tariff.live"></label></div>
        <div class="desc" data-t="tariff.live.desc"></div>
        <div id="tariff-live" class="sgrid"><span class="muted">–</span></div>
      </div>
    </div>
  </section>
  <section id="sec-consumers"><h2 data-t="sec.consumers"></h2><p class="hint" data-t="sec.consumers.hint"></p>
    <div class="tablewrap"><table class="rooms"><thead><tr>
      <th data-t="cons.now"></th><th data-t="cons.device"></th><th data-t="cons.room"></th><th data-t="cons.icon"></th><th data-t="cons.role"></th><th data-t="cons.source"></th><th></th>
    </tr></thead><tbody id="cons-rows"><tr><td colspan="7" class="muted" data-t="cons.waiting"></td></tr></tbody></table></div>
    <div class="srow" style="margin-top:10px"><button class="primary" id="cons-save" data-t="set"></button><span class="muted" id="cons-status"></span></div>
  </section>
  <section id="sec-tado"><h2 data-t="sec.tado"></h2><p class="hint" data-t="sec.tado.hint"></p>
    <div class="ctl" style="margin-bottom:10px">
      <div class="top"><label data-t="tado.rooms"></label><span class="cur unknown" id="tado-cur">–</span></div>
      <div class="desc" data-t="tado.rooms.desc"></div>
      <div class="tablewrap"><table class="rooms"><thead><tr>
        <th data-t="tado.room"></th><th data-t="tado.temp"></th><th data-t="tado.set"></th>
        <th data-t="tado.hum"></th><th data-t="tado.control"></th><th data-t="tado.dev"></th><th data-t="tado.batt"></th>
      </tr></thead><tbody id="tado-rooms"><tr><td colspan="7" class="muted" data-t="tado.waiting"></td></tr></tbody></table></div>
    </div>
    <div class="grid">
      <div class="ctl">
        <div class="top"><label data-t="tado.pair"></label></div>
        <div class="desc" data-t="tado.pair.desc"></div>
        <div class="row">
          <span class="sfield"><label class="slab" data-t="tado.code"></label><input type="text" id="tado-code" inputmode="numeric" maxlength="24" placeholder="12345678901"></span>
          <span class="sfield"><label class="slab" data-t="tado.name"></label><input type="text" id="tado-name" maxlength="32" placeholder="Wohnzimmer"></span>
          <button class="primary" id="tado-pair" data-t="tado.pair.go"></button>
        </div>
        <div class="muted" id="tado-status"></div>
      </div>
      <div class="ctl">
        <div class="top"><label data-t="shift.title"></label><span class="cur unknown" id="shift-cur">–</span></div>
        <div class="desc" data-t="shift.desc"></div>
        <div class="row">
          <span class="sfield"><label class="slab" data-t="shift.on"></label>
            <select id="shift-enabled"><option value="0" data-t="off"></option><option value="1" data-t="on"></option></select></span>
          <span class="sfield"><label class="slab" data-t="shift.boost"></label><input type="number" id="shift-boost" step="0.1" min="0" max="1.5" inputmode="decimal" placeholder="0.5"></span>
          <span class="sfield"><label class="slab" data-t="shift.min"></label><input type="number" id="shift-min" step="10" min="0" inputmode="numeric" placeholder="150"></span>
          <button class="primary" id="shift-save" data-t="set"></button>
        </div>
        <div class="muted" id="shift-state"></div>
      </div>
    </div>
  </section>
  <section id="sec-house"><h2 data-t="sec.house"></h2><p class="hint" data-t="sec.house.hint"></p>
    <div class="grid">
      <div class="ctl">
        <div class="top"><label data-t="house.heat"></label><span class="cur unknown" id="house-cur">–</span></div>
        <div class="desc" data-t="house.heat.desc"></div>
        <div class="row">
          <span class="sfield"><label class="slab" data-t="house.power"></label><input type="number" id="house-power" step="100" min="0" inputmode="numeric" placeholder="3000"></span>
          <span class="sfield"><label class="slab" data-t="house.gas"></label><input type="number" id="house-gas" step="100" min="0" inputmode="numeric" placeholder="18000"></span>
          <span class="sfield"><label class="slab" data-t="house.eff"></label><input type="number" id="house-eff" step="1" min="50" max="100" inputmode="numeric" placeholder="85"></span>
          <span class="sfield"><label class="slab" data-t="house.area"></label><input type="number" id="house-area" step="5" min="0" inputmode="numeric" placeholder="–"></span>
          <span class="sfield"><label class="slab" data-t="house.dhw"></label><input type="number" id="house-dhw" step="1" min="0" max="60" inputmode="numeric" placeholder="15"></span>
          <span class="sfield"><label class="slab" data-t="house.battery"></label><input type="number" id="house-battery" step="0.05" min="0" inputmode="decimal" placeholder="4.1"></span>
          <button class="primary" id="house-save" data-t="set"></button>
        </div>
        <div class="muted" id="house-status"></div>
      </div>
      <div class="ctl">
        <div class="top"><label data-t="house.forecast"></label></div>
        <div class="desc" data-t="house.forecast.desc"></div>
        <div id="house-forecast" class="sgrid"><span class="muted">–</span></div>
        <div class="muted" id="house-abschlag" style="margin-top:8px"></div>
      </div>
    </div>
  </section>
  <section id="sec-cloud"><h2 data-t="sec.cloud"></h2><p class="hint" data-t="sec.cloud.hint"></p>
    <div class="grid">
      <div class="ctl"><div class="top"><label data-t="cloud.switch"></label><span class="cur unknown" id="cloud-state">–</span></div>
        <div class="desc" data-t="cloud.desc"></div>
        <div class="row"><div class="toggle" id="cloud-toggle"><button class="b-on" id="cloud-on" data-t="on"></button><button class="b-off" id="cloud-off" data-t="off"></button></div></div></div>
      <div class="ctl"><div class="top"><label data-t="cloud.status"></label></div><div class="desc" id="cloud-status">–</div></div>
    </div>
  </section>

    },
  };
  let lang = 'en';

  applyStatic();

  // ------------------------------------------------------------------ MQTT

    client.subscribe([`${BASE}/device/+/config`, `${BASE}/+/grobro/+/+/get`, `${BASE}/grobro/+/availability`, `${BASE}/grobro/+/state`, `${BASE}/grobro/+/dongle`,
                      `${BASE}/switch/grobro/cloud_forward/get`, `${BASE}/grobro/cloud_forward/status`, `${BASE}/grolo/config/site`, `${BASE}/grolo/weather/current`, `${BASE}/grolo/fit`, `${BASE}/grolo/fit/status`, `${BASE}/grolo/advice`, `${BASE}/grolo/config/shelly`, `${BASE}/grolo/shelly/state`, `${BASE}/grolo/config/tariff`, `${BASE}/grolo/config/house`, `${BASE}/grolo/forecast`,
                      `${BASE}/grolo/tado/rooms`, `${BASE}/grolo/tado/commission/result`, `${BASE}/grolo/tado/set/result`,
                      `${BASE}/grolo/config/heatshift`, `${BASE}/grolo/heatshift/state`, `${BASE}/grolo/battery`,

    if (topic === `${BASE}/grolo/forecast`) { try { onForecast(JSON.parse(p)); } catch {} return; }

    if ((m = topic.match(new RegExp(`^${BASE}/sensor/grobro/([^/]+)/eco_tracker/state$`)))) { if (!state.device || m[1] === state.device) { try { onEcoTracker(JSON.parse(p)); } catch {} } return; }

    if ((m = topic.match(new RegExp(`^${BASE}/grobro/([^/]+)/dongle$`)))) { if (!state.device || m[1] === state.device) { try { onDongle(JSON.parse(p)); } catch {} } return; }

  });

  // ------------------------------------------------------------------ Discovery → Steuerelemente / controls
  function onDiscovery(device, payload) {
    let d; try { d = JSON.parse(payload); } catch { return; }
    if (!d.cmps) return;
    if (state.device && state.device !== device) { log(`${t('log.otherdev')} ${state.device})`, 'log-info'); return; }
    state.device = device; setPill('dev', `${t('device')} ${device}`, 'ok');
    const cmps = {};
    for (const [uid, c] of Object.entries(d.cmps)) {
      if (!c.command_topic) continue;
      const m = c.command_topic.match(new RegExp(`^${BASE}/([^/]+)/grobro/[^/]+/([^/]+)/(set|read)$`));
      if (!m) continue;
      const topicRoot = m[1], id = m[2], platform = c.platform || topicRoot;
      if (SKIP.has(id)) continue;
      if (id === '31' && platform !== 'button') continue;
      cmps[uid] = { id, uid, platform, topicRoot, name: c.name, min: c.min, max: c.max, step: c.step, unit: c.unit_of_measurement, options: c.options,
                    payload_on: c.payload_on ?? 'ON', payload_off: c.payload_off ?? 'OFF', payload_press: c.payload_press, topic: c.command_topic };
    }
    const before = Object.keys(state.cmps).length;
    state.cmps = cmps; render();
    if (Object.keys(cmps).length !== before) { log(`${Object.keys(cmps).length} ${t('log.discovery')} ${device}`, 'log-ok'); readAll(); }
  }
  const cmpOf = id => Object.values(state.cmps).find(c => c.id === id);

  const labelOf = id => (L(id) || [])[0] || cmpOf(id)?.name || id;
  const descOf = id => (L(id) || [])[1] || '';
  const isSlot = id => /^slot\d+_/.test(id);
  const hhmm = v => { const n = parseInt(v, 10); if (isNaN(n)) return v; return String(Math.floor(n / 100)).padStart(2, '0') + ':' + String(n % 100).padStart(2, '0'); };
  function fmtValue(id, raw) {
    const c = cmpOf(id); if (raw == null) return '–';
    if (/_time$/.test(id)) return /^\d+$/.test(raw) ? hhmm(raw) : raw;
    if (/_mode$/.test(id)) return modeText(raw);
    if (c?.platform === 'switch') return raw === c.payload_on ? t('on').toLowerCase() : raw === c.payload_off ? t('off').toLowerCase() : raw;

  }

  // ------------------------------------------------------------------ Senden / send

  function curSpan(id) { const s = document.createElement('span'); s.className = 'cur unknown'; s.dataset.cur = id; s.textContent = '–'; return s; }
  function updateValue(id) {

    const lat = parseFloat($('site-lat').value), lon = parseFloat($('site-lon').value);
    if (isNaN(lat) || isNaN(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) { $('site-status').textContent = t('site.invalid'); return; }
    const strings = {};
    for (let i = 1; i <= 4; i++) { const tilt = parseFloat($(`site-s${i}-tilt`).value), az = parseFloat($(`site-s${i}-az`).value), wp = parseFloat($(`site-s${i}-wp`).value);
      if (!isNaN(tilt) && !isNaN(az)) strings[i] = { tilt, azimuth: az, wp: isNaN(wp) ? 0 : wp }; }
    const names = {}; for (let i = 1; i <= 4; i++) { const n = ($(`site-s${i}-name`).value || '').trim(); if (n) names[i] = n; }
    const cfg = { name: $('site-q').dataset.name || $('site-q').value.trim(), lat, lon, strings, names, updated: Math.floor(Date.now() / 1000) };
    // Die Maske reist als eigene Felder mit: horizon (am Ort der Module), horizon_source/-_updated als
    // Vermerk, woher sie stammt, und daneben Platz für eine zweite gemessene Maske, den Restschatten und
    // den nahen Baum. horizon_updated wird nur neu gesetzt, wenn sich die Maske wirklich geändert hat –
    // sonst stünde bei jedem Speichern ein neues Messdatum an einer alten Messung.
    const hz = parseHorizon($('site-horizon').value);
    if (hz.horizon && Object.keys(hz.horizon).length) {
      const old = state.site || {};
      const same = JSON.stringify(old.horizon || null) === JSON.stringify(hz.horizon);
      cfg.horizon = hz.horizon;
      cfg.horizon_source = hz.horizon_source || old.horizon_source || '';
      cfg.horizon_updated = same && old.horizon_updated ? old.horizon_updated : cfg.updated;
      if (hz.horizon_variants) cfg.horizon_variants = hz.horizon_variants;
      if (hz.horizon_residual) cfg.horizon_residual = hz.horizon_residual;
      if (hz.horizon_tree) cfg.horizon_tree = hz.horizon_tree;
    }
    client.publish(`${BASE}/grolo/config/site`, JSON.stringify(cfg), { qos: 0, retain: true });
    // Namen zusätzlich flach für Telegraf -> InfluxDB -> Grafana-Variablen (leer = Standard "String n")
    client.publish(`${BASE}/grolo/config/string_names`, JSON.stringify({ s1: names[1] || `String 1`, s2: names[2] || `String 2`, s3: names[3] || `String 3`, s4: names[4] || `String 4`, updated: cfg.updated }), { qos: 0, retain: true });
    renderStringLabels();
    state.siteDirty = false; $('site-status').textContent = t('site.saved'); log(`→ ${t('log.site')}: ${cfg.name || ''} (${lat}, ${lon}), ${Object.keys(strings).length} Strings`, 'log-tx');
    if (cfg.horizon) log(`→ ${t('log.horizon')}: ${Object.keys(cfg.horizon).length} ${lang === 'de' ? 'Stützstellen' : 'support points'}${cfg.horizon_source ? ' · ' + cfg.horizon_source : ''}`, 'log-tx');
  };

  // ------------------------------------------------------------------ Strompreis und Ersparnis / electricity price
  // gas_ct_kwh: Marktmittel Neukunden Deutschland, Stand 09/2026. Greift nur, solange das Feld leer ist;
  // gerechnet wird die Vorgabe auf der Website (GAS_CT_KWH_MARKET), hier steht sie als Beleg und im
  // placeholder des Felds. Gas-Grundpreis bewusst ohne Vorgabe – er schwankt zwischen den Anbietern zu stark.
  const TARIFF_DEFAULTS = { price_ct_kwh: 30, feedin_ct_kwh: 0, system_cost_eur: 0, gas_ct_kwh: 11 };
  // Der Nutzungsgrad des alten Kessels wird bei den Hausdaten gepflegt (boiler_eff in grolo/config/house)
  // und gehört auch dorthin. Zur Website reist aber nur der Tarif – die Hausdaten bleiben im Haus. Damit
  // sie den Gasvergleich trotzdem rechnen kann, fährt der Nutzungsgrad als Kopie im Tarif mit. Eine Kopie
  // veraltet, deshalb schreibt sie jeder der beiden Speichern-Knöpfe neu; gepflegt wird weiter nur an
  // einer Stelle. Ohne Angabe bleibt sie leer, und die Website lässt die Kachel weg.
  const gasEff = () => {
    const h = state.house && Number(state.house.boiler_eff);
    if (h) return Math.round(h * 100) / 100;
    const v = parseFloat($('house-eff').value);
    return isNaN(v) || v <= 0 ? null : Math.round(v) / 100;
  };
  const fmtCt = v => new Intl.NumberFormat(lang === 'de' ? 'de-DE' : 'en-GB', { maximumFractionDigits: 1 }).format(v);
  const fmtEur = v => new Intl.NumberFormat(lang === 'de' ? 'de-DE' : 'en-GB', { style: 'currency', currency: 'EUR' }).format(v);
  function onTariff(cfg, rerender = false) {
    if (!rerender && state.tariff && state.tariff.updated !== cfg.updated) log(`${t('log.tariff')}: ${fmtCt(cfg.price_ct_kwh)} ct/kWh`, 'log-info');
    state.tariff = cfg;
    const set = (id, v) => { const el = $(id); if (el && document.activeElement !== el) el.value = v ?? ''; };
    set('tariff-price', cfg.price_ct_kwh); set('tariff-feedin', cfg.feedin_ct_kwh ?? 0); set('tariff-cost', cfg.system_cost_eur || '');
    set('tariff-base', cfg.base_eur_month ?? ''); set('tariff-abschlag', cfg.abschlag_eur_month ?? '');
    set('tariff-gas', cfg.gas_ct_kwh ?? ''); set('tariff-gasbase', cfg.gas_base_eur_month ?? '');
    $('tariff-cur').textContent = `${fmtCt(cfg.price_ct_kwh)} ct/kWh` + (cfg.system_cost_eur ? ` · ${fmtEur(cfg.system_cost_eur)}` : ''); $('tariff-cur').className = 'cur';
    renderTariffLive();
  }
  function renderTariffLive() {
    const el = $('tariff-live'); if (!el) return;
    const price = state.tariff ? Number(state.tariff.price_ct_kwh) : TARIFF_DEFAULTS.price_ct_kwh;
    const out = state.st && state.st.onGridPower != null ? (Number(state.st.onGridPower) - 30000) / 10 : null;
    const sh = state.shellyState; const grid = sh && sh.enabled && sh.ok && sh.grid_w != null ? Math.max(0, Number(sh.grid_w)) : null;
    const cell = (label, val, sub, color) => `<div class="scell"><div class="sl">${label}</div><div class="sv"${color ? ` style="color:${color}"` : ''}>${val}</div>${sub ? `<div class="muted">${sub}</div>` : ''}</div>`;
    const rate = w => `${fmtCt(w / 1000 * price)} ct/h`;
    const perDay = w => `${fmtEur(w / 1000 * price * 24 / 100)} ${t('tariff.perDay')}`;
    el.innerHTML = (out != null ? cell(t('tariff.saveRate'), rate(Math.max(0, out)), perDay(Math.max(0, out)), 'var(--green)') : '')
      + (grid != null ? cell(t('tariff.gridRate'), rate(grid), perDay(grid), 'var(--red)') : '')
      + cell(t('tariff.used'), `${fmtCt(price)} ct/kWh`, state.tariff ? '' : t('tariff.default'));
  }
  $('tariff-save').onclick = () => {
    const price = parseFloat($('tariff-price').value);
    if (isNaN(price) || price < 0) { $('tariff-status').textContent = t('tariff.invalid'); return; }
    const num = id => { const v = parseFloat($(id).value); return isNaN(v) || v < 0 ? null : Math.round(v * 100) / 100; };
    const cfg = { price_ct_kwh: Math.round(price * 100) / 100, feedin_ct_kwh: Math.max(0, parseFloat($('tariff-feedin').value) || 0), system_cost_eur: Math.max(0, parseFloat($('tariff-cost').value) || 0),
                  base_eur_month: num('tariff-base'), abschlag_eur_month: num('tariff-abschlag'),
                  gas_ct_kwh: num('tariff-gas'), gas_base_eur_month: num('tariff-gasbase'), gas_eff: gasEff(),
                  currency: 'EUR', updated: Math.floor(Date.now() / 1000) };
    client.publish(`${BASE}/grolo/config/tariff`, JSON.stringify(cfg), { qos: 0, retain: true });
    $('tariff-status').textContent = t('tariff.saved'); log(`→ ${t('log.tariff')}: ${fmtCt(cfg.price_ct_kwh)} ct/kWh, ${t('tariff.feedin')} ${fmtCt(cfg.feedin_ct_kwh)}, ${t('tariff.cost')} ${cfg.system_cost_eur}`, 'log-tx');
    onTariff(cfg, true);
  };
  renderTariffLive();

  // ------------------------------------------------------------------ Verbraucher
  // Die Liste kommt vom Dienst consumers (alle 10 s). Die Felder werden nur beim ersten Auftauchen eines Geräts
  // befüllt und danach nicht mehr angefasst – sonst risse jede Aktualisierung den halb getippten Namen weg.
  // Gespeichert wird in <BASE>/grolo/config/consumers, devices.<id> = { name: "Gerät - Raum", icon, role }.
  const CONS_ICONS = ['plug', 'fridge', 'tv', 'pc', 'washer', 'dryer', 'dishwasher', 'oven', 'heatpump', 'coffee', 'light', 'ac', 'car'];
  const CONS_ROLES = ['auto', 'consumer', 'source', 'hidden'];
  const esc2 = x => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const consSplit = n => { const m = String(n || '').match(/^(.+?)\s+[-–—|·]\s+(.+)$/); return m ? [m[1], m[2]] : [String(n || ''), '']; };
  function onConsumers(st) {
    const tb = $('cons-rows'); if (!tb) return;
    if (tb.querySelector('td[colspan]')) tb.innerHTML = '';
    for (const it of st.items || []) {
      let tr = tb.querySelector(`tr[data-id="${CSS.escape(it.id)}"]`);
      if (!tr) {
        const cfg = ((state.consCfg || {}).devices || {})[it.id] || {};
        const [dev, room] = consSplit(cfg.name || it.name);
        const src = it.kind === 'shelly' ? `Shelly ${esc2(it.host || '')}` : it.kind === 'switchbot' ? 'SwitchBot' : it.kind === 'smartthings' ? 'SmartThings'
          : it.kind === 'wolf' ? 'WOLF Link' : it.kind === 'virtual' ? t('cons.virtual') : esc2(it.kind || '');
        tr = document.createElement('tr'); tr.dataset.id = it.id;
        tr.innerHTML = `<td class="cons-w"></td>
          <td><input type="text" class="cons-dev" maxlength="40" value="${esc2(dev)}"></td>
          <td><input type="text" class="cons-room" maxlength="30" value="${esc2(room)}" placeholder="–"></td>
          <td><select class="cons-icon">${CONS_ICONS.map(x => `<option${(cfg.icon || it.icon) === x ? ' selected' : ''}>${x}</option>`).join('')}</select></td>
          <td><select class="cons-role">${CONS_ROLES.map(x => `<option value="${x}"${(cfg.role || 'auto') === x ? ' selected' : ''}>${t('cons.role.' + x)}</option>`).join('')}</select></td>
          <td class="muted">${src}</td>
          <td>${it.kind === 'shelly' ? `<button class="cons-blink">${t('cons.blink')}</button>` : ''}</td>`;
        const b = tr.querySelector('.cons-blink');
        if (b) b.onclick = () => { client.publish(`${BASE}/grolo/consumers/identify`, it.id); $('cons-status').textContent = t('cons.blinking'); };
        tb.appendChild(tr);
      }
      tr.querySelector('.cons-w').textContent = it.w == null ? '–' : (it.estimated && it.w > 0.1 ? '≈ ' : '') + (Math.abs(it.w) < 10 ? it.w.toFixed(1) : Math.round(it.w)) + ' W';
    }
  }
  // Die gespeicherte Einstellung kann nach der ersten Geräteliste ankommen: dann Art und Symbol nachziehen,
  // die Namensfelder nur, solange niemand darin tippt.
  function applyConsCfg() {
    const devs = (state.consCfg || {}).devices || {};
    for (const tr of document.querySelectorAll('#cons-rows tr[data-id]')) {
      const c = devs[tr.dataset.id]; if (!c) continue;
      if (c.role) tr.querySelector('.cons-role').value = c.role;
      if (c.icon) tr.querySelector('.cons-icon').value = c.icon;
      if (c.name && !tr.contains(document.activeElement)) { const [d, r] = consSplit(c.name); tr.querySelector('.cons-dev').value = d; tr.querySelector('.cons-room').value = r; }
    }
  }
  $('cons-save').onclick = () => {
    const cfg = JSON.parse(JSON.stringify(state.consCfg || {})); cfg.devices = cfg.devices || {};
    for (const tr of $('cons-rows').querySelectorAll('tr[data-id]')) {
      const id = tr.dataset.id, dev = tr.querySelector('.cons-dev').value.trim(), room = tr.querySelector('.cons-room').value.trim();
      const d = cfg.devices[id] = cfg.devices[id] || {};
      if (dev) d.name = room ? `${dev} - ${room}` : dev; else delete d.name;
      d.icon = tr.querySelector('.cons-icon').value;
      const role = tr.querySelector('.cons-role').value; if (role === 'auto') delete d.role; else d.role = role;
    }
    client.publish(`${BASE}/grolo/config/consumers`, JSON.stringify(cfg), { qos: 0, retain: true });
    state.consCfg = cfg; $('cons-status').textContent = t('cons.saved'); log(`→ ${t('log.cons')}: ${Object.keys(cfg.devices).length}`, 'log-tx');
  };

  // ------------------------------------------------------------------ Räume (tado X über Matter)
  // Die Seite rechnet nichts und hält nichts vor: sie zeigt, was die tado-Bridge veröffentlicht, und
  // schickt Kopplungsaufträge dorthin zurück. Der Raumname wird nach erfolgreicher Kopplung ins Gerät
  // geschrieben, damit er dort bleibt und nicht in einer Konfigurationsdatei hier.
  let tadoPending = null;      // {name} solange eine Kopplung läuft
  let tadoDeferred = false;    // Neuaufbau der Tabelle zurückgestellt, weil jemand darin tippt
  function onTadoRooms(rooms) {
    state.tado = rooms;
    const tb = $('tado-rooms'); if (!tb) return;
    // Die Bridge meldet alle 30 s; ein Neuaufbau mitten im Tippen würde die Eingabe wegwischen.
    // Solange jemand in der Tabelle steht, wird der Stand gemerkt und beim Verlassen nachgezogen.
    if (tb.contains(document.activeElement)) {
      if (!tadoDeferred) {
        tadoDeferred = true;
        document.activeElement.addEventListener('blur', () => {
          tadoDeferred = false;
          setTimeout(() => onTadoRooms(state.tado), 50);
        }, { once: true });
      }
      return;
    }
    const keys = Object.keys(rooms || {}).sort((a, b) => (rooms[a].name || a).localeCompare(rooms[b].name || b));
    $('tado-cur').textContent = keys.length ? `${keys.length}` : '–';
    $('tado-cur').className = keys.length ? 'cur' : 'cur unknown';
    if (!keys.length) { tb.innerHTML = `<tr><td colspan="6" class="muted">${t('tado.waiting')}</td></tr>`; return; }
    const n1 = v => v == null ? '–' : Number(v).toFixed(1);
    tb.innerHTML = keys.map(k => {
      const r = rooms[k];
      const src = r.temp_source === 'sensor' ? '📡' : '';
      const fall = r.temp_fallback ? ` <span style="color:var(--orange)" title="${t('tado.fallback')}">⚠</span>` : '';
      const off = r.radiator_offset_k != null ? `<div class="muted sub">Stau ${r.radiator_offset_k > 0 ? '+' : ''}${n1(r.radiator_offset_k)} K</div>` : '';
      const split = r.setpoint_split ? `<div class="muted sub" style="color:var(--orange)">${r.setpoint_split.join(' / ')}</div>` : '';
      const batt = { ok: 'ok', 'niedrig': '⚠ niedrig', 'kritisch': '⛔ kritisch' }[r.battery_text] || '–';
      const bcol = r.battery_level ? (r.battery_level > 1 ? 'var(--red)' : 'var(--orange)') : 'var(--muted)';
      // Nur Räume mit Thermostat lassen sich stellen; ein reiner Fühler kann nichts heizen.
      const can = (r.thermostats || []).length > 0 && r.setpoint_c != null;
      const lo = r.limit_min_c != null ? r.limit_min_c : 5, hi = r.limit_max_c != null ? r.limit_max_c : 30;
      const modes = (r.modes || ['off', 'heat']).map(m =>
        `<option value="${m}"${r.mode_text === m ? ' selected' : ''}>${t('mode.' + m) || m}</option>`).join('');
      const ctl = can
        ? `<div class="stepper">
             <button data-room="${k}" data-step="-0.5" title="−0,5 K">−</button>
             <input type="number" id="tado-sp-${k}" step="0.5" min="${lo}" max="${hi}" value="${n1(r.setpoint_c)}">
             <button data-room="${k}" data-step="0.5" title="+0,5 K">+</button>
             <select id="tado-md-${k}" data-room="${k}">${modes}</select>
           </div>`
        : `<span class="muted">${t('tado.sensoronly')}</span>`;
      return `<tr><td><b>${r.name || k}</b>${r.available ? '' : ' <span style="color:var(--red)">offline</span>'}</td>
        <td>${n1(r.temp_c)} °C ${src}${fall}${off}</td>
        <td>${r.setpoint_c == null ? '–' : n1(r.setpoint_c) + ' °C'}${split}</td>
        <td>${n1(r.humidity_pct)} %</td>
        <td>${ctl}</td>
        <td class="muted">${(r.nodes || []).join(', ')}${(r.sensors || []).length ? ` (+${r.sensors.length} 📡)` : ''}</td>
        <td style="color:${bcol}">${batt}</td></tr>`;
    }).join('');
    // Die Tabelle wird bei jeder Nachricht neu gebaut, deshalb hängen die Handler an den frischen Knoten.
    for (const b of tb.querySelectorAll('button[data-step]')) b.onclick = () => stepRoom(b.dataset.room, Number(b.dataset.step));
    for (const el of tb.querySelectorAll('input[id^="tado-sp-"]')) {
      el.onchange = () => sendRoom(el.id.slice(8), Number(el.value));
      el.onkeydown = e => { if (e.key === 'Enter') el.blur(); };
    }
    for (const el of tb.querySelectorAll('select[id^="tado-md-"]')) el.onchange = () => sendMode(el.dataset.room, el.value);
  }
  // Schreiben geht immer über die Bridge: die prüft gegen die Grenzwerte, die das Gerät selbst meldet,
  // und schickt an alle Thermostate des Raums. Die Seite hält keinen eigenen Zustand vor.
  function sendRoom(room, value) {
    if (!isFinite(value)) return;
    client.publish(`${BASE}/grolo/tado/set`, JSON.stringify({ room, setpoint: value }), { qos: 0, retain: false });
    log(`→ ${t('log.tadoset')}: ${room} ${value.toFixed(1)} °C`, 'log-tx');
    $('tado-status').textContent = `${room}: ${value.toFixed(1)} °C …`;
  }
  function stepRoom(room, delta) {
    const el = $(`tado-sp-${room}`); if (!el) return;
    const next = Math.round((Number(el.value) + delta) * 2) / 2;
    const lo = Number(el.min), hi = Number(el.max);
    el.value = Math.min(Math.max(next, lo), hi).toFixed(1);
    sendRoom(room, Number(el.value));
  }
  function sendMode(room, mode) {
    client.publish(`${BASE}/grolo/tado/set`, JSON.stringify({ room, mode }), { qos: 0, retain: false });
    log(`→ ${t('log.tadoset')}: ${room} ${mode}`, 'log-tx');
  }
  $('tado-pair').onclick = () => {
    const code = ($('tado-code').value || '').replace(/[^0-9]/g, '');
    if (code.length < 8) { $('tado-status').textContent = t('tado.needcode'); return; }
    tadoPending = { name: ($('tado-name').value || '').trim() };
    $('tado-status').textContent = t('tado.pairing');
    $('tado-pair').disabled = true;
    client.publish(`${BASE}/grolo/tado/commission`, JSON.stringify({ code }), { qos: 0, retain: false });
    log(`→ ${t('log.tado')}: …${code.slice(-4)}`, 'log-tx');
  };
  function onTadoPaired(res) {
    $('tado-pair').disabled = false;
    if (!res || !res.ok) {
      $('tado-status').textContent = t('tado.failed').replace('{e}', (res && res.error) || '?');
      log(`${t('tado.failed').replace('{e}', (res && res.error) || '?')}`, 'log-err');
      tadoPending = null; return;
    }
    const name = tadoPending && tadoPending.name;
    if (name) client.publish(`${BASE}/grolo/tado/set`, JSON.stringify({ node: res.node, name }), { qos: 0, retain: false });
    $('tado-status').textContent = t('tado.paired').replace('{n}', res.node).replace('{name}', name || '–');
    log(`✔ ${t('log.tado')}: Node ${res.node}${name ? ' = ' + name : ''}`, 'log-ok');
    $('tado-code').value = ''; $('tado-name').value = '';
    tadoPending = null;
  }
  function onTadoSet(res) {
    if (!res) return;
    if (res.ok === false && res.error) { log(`⚠ tado: ${res.error}`, 'log-err'); $('tado-status').textContent = res.error; return; }
    if (res.ok && res.setpoint != null) $('tado-status').textContent = `${res.room}: ${Number(res.setpoint).toFixed(1)} °C ✔`;
    if (res.ok && res.mode) $('tado-status').textContent = `${res.room}: ${res.mode} ✔`;
  }

  function onShiftCfg(cfg) {
    if (!cfg || typeof cfg !== 'object') return;
    const set = (id, v) => { const el = $(id); if (el && document.activeElement !== el) el.value = v ?? ''; };
    set('shift-enabled', cfg.enabled ? '1' : '0');
    set('shift-boost', cfg.boost_k ?? '');
    set('shift-min', cfg.min_surplus_w ?? '');
  }
  function onShiftState(st) {
    const el = $('shift-state'); if (!el || !st) return;
    const boosted = Object.keys(st.boosted || {});
    $('shift-cur').textContent = st.enabled ? (boosted.length ? `+${st.boost_k} K` : (lang === 'de' ? 'bereit' : 'ready')) : (lang === 'de' ? 'aus' : 'off');
    $('shift-cur').className = st.enabled ? (boosted.length ? 'cur' : 'cur') : 'cur unknown';
    const parts = [st.reason];
    if (st.surplus_w != null) parts.push(`PV ${st.pv_w} W − Haus ${st.house_w} W = ${st.surplus_w} W`);
    if (boosted.length) parts.push((lang === 'de' ? 'angehoben: ' : 'raised: ') + boosted.join(', '));
    el.textContent = parts.join(' · ');
  }
  $('shift-save').onclick = () => {
    const num = (id, d) => { const v = parseFloat($(id).value); return isNaN(v) || v < 0 ? d : v; };
    const cfg = { enabled: $('shift-enabled').value === '1', boost_k: Math.min(num('shift-boost', 0.5), 1.5),
                  min_surplus_w: num('shift-min', 150), updated: Math.floor(Date.now() / 1000) };
    client.publish(`${BASE}/grolo/config/heatshift`, JSON.stringify(cfg), { qos: 0, retain: true });
    $('shift-state').textContent = t('shift.saved');
    log(`→ ${t('log.shift')}: ${cfg.enabled ? 'an' : 'aus'}, ${cfg.boost_k} K ab ${cfg.min_surplus_w} W`, 'log-tx');
  };

  // ------------------------------------------------------------------ Haus, Wärmebedarf und Jahresprognose
  // Die Angaben hier kann niemand messen: was das Gebäude an Wärme braucht und wie groß die Batterie ist.
  // Alles andere holt sich der Prognosedienst selbst – Standort, Preis, Module und die eigenen Messwerte.
  function onHouse(cfg, local) {
    if (!cfg || typeof cfg !== 'object') return;
    state.house = cfg;
    if (!local) {
      const set = (id, v) => { const el = $(id); if (el && document.activeElement !== el) el.value = v ?? ''; };
      set('house-power', cfg.power_kwh_year || '');
      set('house-gas', cfg.gas_kwh_year || '');
      set('house-eff', cfg.boiler_eff ? Math.round(cfg.boiler_eff * 100) : '');
      set('house-area', cfg.area_m2 || '');
      set('house-dhw', cfg.dhw_share != null ? Math.round(cfg.dhw_share * 100) : '');
      set('house-battery', cfg.battery_kwh || '');
    }
    const heat = cfg.gas_kwh_year ? cfg.gas_kwh_year * (cfg.boiler_eff || 0.85) : null;
    $('house-cur').textContent = heat ? `${Math.round(heat).toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB')} kWh` : '–';
    $('house-cur').className = heat ? 'cur' : 'cur unknown';
  }
  $('house-save').onclick = () => {
    const num = (id, div) => { const v = parseFloat($(id).value); return isNaN(v) || v < 0 ? null : (div ? Math.round(v) / div : Math.round(v)); };
    const cfg = { power_kwh_year: num('house-power'), gas_kwh_year: num('house-gas'), boiler_eff: num('house-eff', 100), area_m2: num('house-area'),
                  dhw_share: num('house-dhw', 100), battery_kwh: parseFloat($('house-battery').value) || null,
                  updated: Math.floor(Date.now() / 1000) };
    client.publish(`${BASE}/grolo/config/house`, JSON.stringify(cfg), { qos: 0, retain: true });
    // Der Nutzungsgrad fährt als Kopie im Tarif mit (siehe gasEff). Ändert er sich hier, muss der Tarif
    // nachgezogen werden – sonst rechnete die Website den Gasvergleich weiter mit dem alten Kessel.
    // „nicht gesetzt" ist hier fehlend wie leer dasselbe, sonst schriebe jeder Speichern-Klick den Tarif neu.
    if (state.tariff && (state.tariff.gas_eff ?? null) !== (cfg.boiler_eff ?? null)) {
      const tf = Object.assign({}, state.tariff, { gas_eff: cfg.boiler_eff ?? null, updated: Math.floor(Date.now() / 1000) });
      client.publish(`${BASE}/grolo/config/tariff`, JSON.stringify(tf), { qos: 0, retain: true });
      onTariff(tf, true);
    }
    $('house-status').textContent = t('house.saved');
    log(`→ ${t('log.house')}: ${cfg.gas_kwh_year || '–'} kWh Gas, ${cfg.area_m2 || '–'} m², ${cfg.battery_kwh || '–'} kWh`, 'log-tx');
    onHouse(cfg, true);
  };
  function onForecast(f) {
    state.forecast = f;
    const el = $('house-forecast'); if (!el || !f || !f.year) return;
    const y = f.year, ab = f.abschlag || {};
    const nf = n => n == null ? '–' : Math.round(n).toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB');
    const cell = (label, val, sub, color) => `<div class="scell"><div class="sl">${label}</div><div class="sv"${color ? ` style="color:${color}"` : ''}>${val}</div>${sub ? `<div class="muted">${sub}</div>` : ''}</div>`;
    const kwh = lang === 'de' ? 'kWh im Jahr' : 'kWh a year';
    el.innerHTML = cell(lang === 'de' ? 'Verbrauch' : 'Consumption', `${nf(y.load_kwh)}`, kwh)
      + cell(lang === 'de' ? 'davon Wärmepumpe' : 'of it heat pump', `${nf(y.heatpump_kwh)}`, kwh, 'var(--orange)')
      + cell(lang === 'de' ? 'Netzbezug' : 'Grid import', `${nf(y.grid_kwh)}`, kwh, 'var(--red)')
      + cell(lang === 'de' ? 'Jahresrechnung' : 'Annual bill', `${nf(y.cost_total_eur)} €`, `${nf(y.cost_energy_eur)} € + ${nf(y.cost_base_eur)} € ${lang === 'de' ? 'Grundpreis' : 'base fee'}`, 'var(--red)')
      + cell(lang === 'de' ? 'Abschlag' : 'Monthly payment', `${nf(ab.recommended_eur)} €`, lang === 'de' ? 'empfohlen' : 'recommended', 'var(--green)');
    $('house-abschlag').textContent = lang === 'de' ? (ab.de || '') : (ab.en || '');
  }
  if ($('house-forecast')) $('house-forecast').innerHTML = `<span class="muted">${t('house.waiting')}</span>`;

})();
</script>
</body>
</html>
