<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GroLo · Growatt Local</title>
<style>
  :root { --bg:#111217; --panel:#181b1f; --line:#2c3235; --text:#d8d9da; --muted:#8e8e8e;
          --accent:#f2cc0c; --green:#73bf69; --orange:#ff9830; --red:#f2495c; --blue:#5794f2; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
  header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5 }
  header h1 { font-size:18px; margin:0; font-weight:700; letter-spacing:.02em } header h1 small { color:var(--muted); font-weight:400; font-size:12px; margin-left:6px }
  header .spacer { flex:1 }
  .pill { padding:3px 10px; border-radius:12px; font-size:12px; background:#26292d; color:var(--muted) }
  .pill.ok { background:#1f3a24; color:var(--green) } .pill.bad { background:#3f1e22; color:var(--red) } .pill.warn { background:#3f3018; color:var(--orange) }
  main { max-width:1200px; margin:0 auto; padding:18px 20px 60px; display:grid; gap:18px }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px }
  section h2 { margin:0 0 4px; font-size:15px; font-weight:600 }
  section h3 { margin:14px 0 6px; font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em }
  section p.hint { margin:0 0 12px; color:var(--muted); font-size:12.5px }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:10px }
  .ctl { border:1px solid var(--line); border-radius:6px; padding:10px 12px; display:grid; gap:6px; background:#1c1f24 }
  .ctl .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px }
  .ctl label { font-weight:600; font-size:13px }
  .cur { font-variant-numeric:tabular-nums; color:var(--accent); font-weight:600; white-space:nowrap }
  .cur.pending { color:var(--orange) } .cur.unknown { color:var(--muted); font-weight:400 }
  #site-cur { white-space:normal; text-align:right; font-size:12.5px; overflow-wrap:anywhere }
  #sec-site .ctl { min-width:0 } #sec-site .row input[type=text] { min-width:120px }
  #site-strings td.az { display:flex; gap:4px; align-items:center } #site-strings td.az input { flex:1 1 60px; min-width:60px } #site-strings td.az select { flex:0 0 auto; width:auto; padding:4px 4px }
  .ctl .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap }
  .desc, .muted { color:var(--muted); font-size:12px }
  input[type=number], input[type=time], input[type=text], select {
    flex:1; min-width:0; background:#0f1114; color:var(--text); border:1px solid #3a4046; border-radius:4px; padding:6px 8px; font-size:14px }
  input[type=range] { flex:1; accent-color:var(--accent) }
  button { background:#2f3540; color:var(--text); border:1px solid #444b54; border-radius:4px; padding:6px 12px; font-size:13px; cursor:pointer; white-space:nowrap }
  button:hover { background:#3a414d } button.primary { background:#3d5a80; border-color:#4a6d9a } button.primary:hover { background:#476a96 }
  button.danger { background:#5a2a2f; border-color:#7a3a41 }
  .toggle { display:inline-flex; border:1px solid #444b54; border-radius:4px; overflow:hidden }
  .toggle button { border:0; border-radius:0; padding:6px 14px } .toggle button.on { background:var(--green); color:#111 } .toggle button.off { background:var(--red); color:#111 }
  .toggle.lang button.on { background:var(--blue); color:#fff }
  table { width:100%; border-collapse:collapse; font-size:13px }
  th, td { padding:6px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle }
  th { color:var(--muted); font-weight:600; font-size:12px }
  td input, td select { width:100%; padding:4px 6px; font-size:13px }
  td.slotno { font-weight:600 }
  .tablewrap { overflow-x:auto }
  .info { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px }
  .kv { background:#1c1f24; border:1px solid var(--line); border-radius:6px; padding:8px 10px }
  .kv .k { color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em }
  .kv .v { font-size:15px; font-weight:600; margin-top:2px; word-break:break-all } .kv .v.small { font-size:12.5px; font-weight:400 }
  #log { font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; max-height:240px; overflow:auto; background:#0f1114; border:1px solid var(--line); border-radius:4px; padding:8px 10px; color:#b5b8bc; white-space:pre-wrap }
  .log-ok { color:var(--green) } .log-err { color:var(--red) } .log-tx { color:var(--blue) } .log-cloud { color:#c084fc } .log-info { color:#9aa0a6 }
  a { color:var(--blue) }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 20px 30px }
  @media (max-width:700px) { header { padding:10px 12px } main { padding:12px } }
</style>
</head>
<body>
<header>
  <h1>GroLo <small>Growatt Local · 2026.37.2</small></h1>
  <span id="conn" class="pill">…</span>
  <span id="dev" class="pill">–</span>
  <span id="avail" class="pill">–</span>
  <span class="spacer"></span>
  <div class="toggle lang" id="lang"><button data-lang="en">EN</button><button data-lang="de">DE</button></div>
  <button id="readall" class="primary"></button>
  <a id="grafana" href="#" target="_blank"></a>
</header>

<main>
  <section id="sec-device"><h2 data-t="sec.device"></h2><p class="hint" data-t="sec.device.hint"></p>

    <h3 data-t="dongle.title"></h3><div class="info" id="dongle-info"><span class="muted" data-t="dongle.waiting"></span></div>
  </section>

  <section id="sec-mode"><h2 data-t="sec.mode"></h2><p class="hint" data-t="sec.mode.hint"></p><div class="grid" id="mode-grid"></div></section>
  <section id="sec-battery"><h2 data-t="sec.battery"></h2><p class="hint" data-t="sec.battery.hint"></p><div class="grid"></div></section>
  <section id="sec-output"><h2 data-t="sec.output"></h2><p class="hint" data-t="sec.output.hint"></p><div class="grid"></div></section>
  <section id="sec-slots"><h2 data-t="sec.slots"></h2><p class="hint" data-t="sec.slots.hint"></p>
    <div class="tablewrap"><table><thead><tr><th>Slot</th><th data-t="slots.active"></th><th data-t="slots.start"></th><th data-t="slots.end"></th><th data-t="slots.mode"></th><th data-t="slots.power"></th><th></th></tr></thead><tbody id="slots"></tbody></table></div>
  </section>
  <section id="sec-site"><h2 data-t="sec.site"></h2><p class="hint" data-t="sec.site.hint"></p>
    <div class="grid">
      <div class="ctl"><div class="top"><label data-t="site.place"></label><span class="cur unknown" id="site-cur">–</span></div>
        <div class="desc" data-t="site.place.desc"></div>
        <div class="row"><input type="text" id="site-q" placeholder="25421 Pinneberg"><button id="site-search" data-t="site.search"></button></div>
        <div class="row"><select id="site-results" hidden></select></div>
        <div class="row"><span class="muted" style="min-width:60px" data-t="site.coords"></span><input type="number" id="site-lat" step="0.0001" min="-90" max="90" placeholder="53.66"><input type="number" id="site-lon" step="0.0001" min="-180" max="180" placeholder="9.80"></div>
      </div>
      <div class="ctl"><div class="top"><label data-t="site.sun"></label></div><div class="desc" id="site-sun" data-t="site.sun.waiting"></div></div>
    </div>
    <h3 data-t="site.strings"></h3><p class="hint" data-t="site.strings.hint"></p>
    <div class="tablewrap"><table><thead><tr><th>String</th><th data-t="site.tilt"></th><th data-t="site.azimuth"></th><th data-t="site.wp"></th><th data-t="site.now"></th><th data-t="site.fit"></th></tr></thead><tbody id="site-strings"></tbody></table></div>
    <div class="row" style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button id="site-save" class="primary" data-t="site.save"></button><span class="muted" id="site-status"></span>
      <span class="spacer"></span><button id="fit-run" data-t="fit.run"></button><span class="muted" id="fit-status" data-t="fit.none"></span></div>
  </section>
  <section id="sec-cloud"><h2 data-t="sec.cloud"></h2><p class="hint" data-t="sec.cloud.hint"></p>
    <div class="grid">
      <div class="ctl"><div class="top"><label data-t="cloud.switch"></label><span class="cur unknown" id="cloud-state">–</span></div>
        <div class="desc" data-t="cloud.desc"></div>
        <div class="row"><div class="toggle" id="cloud-toggle"><button class="b-on" id="cloud-on" data-t="on"></button><button class="b-off" id="cloud-off" data-t="off"></button></div></div></div>
      <div class="ctl"><div class="top"><label data-t="cloud.status"></label></div><div class="desc" id="cloud-status">–</div></div>
    </div>
  </section>
  <section id="sec-dongle"><h2 data-t="sec.dongle"></h2><p class="hint" data-t="sec.dongle.hint"></p><div class="grid"></div></section>
  <section id="sec-other" hidden><h2 data-t="sec.other"></h2><p class="hint" data-t="sec.other.hint"></p><div class="grid"></div></section>
  <section><h2 data-t="sec.log"></h2><p class="hint" data-t="sec.log.hint"></p><div id="log"></div></section>
</main>
<footer>GroLo · Growatt Local · v2026.37.2 · MQTT <span id="ws-url"></span></footer>

    },
  };
  let lang = 'en';

  const setPill = (id, text, cls) => { const e = document.getElementById(id); e.textContent = text; e.className = 'pill ' + (cls || ''); };

  function applyStatic() {

  // ------------------------------------------------------------------ MQTT

                      `${BASE}/switch/grobro/cloud_forward/get`, `${BASE}/grobro/cloud_forward/status`, `${BASE}/grolo/config/site`, `${BASE}/grolo/weather/current`, `${BASE}/grolo/fit`, `${BASE}/grolo/fit/status`]);

    if ((m = topic.match(new RegExp(`^${BASE}/grobro/([^/]+)/state$`)))) { if (!state.device || m[1] === state.device) { try { onState(m[1], JSON.parse(p)); } catch {} } return; }

  // ------------------------------------------------------------------ Discovery → Steuerelemente / controls
  function onDiscovery(device, payload) {
    let d; try { d = JSON.parse(payload); } catch { return; }
    if (!d.cmps) return;
    if (state.device && state.device !== device) { log(`${t('log.otherdev')} ${state.device})`, 'log-info'); return; }
    state.device = device; setPill('dev', `${t('device')} ${device}`, 'ok');
    const cmps = {};
    for (const [uid, c] of Object.entries(d.cmps)) {
      if (!c.command_topic) continue;
      const m = c.command_topic.match(new RegExp(`^${BASE}/([^/]+)/grobro/[^/]+/([^/]+)/(set|read)$`));
      if (!m) continue;
      const topicRoot = m[1], id = m[2], platform = c.platform || topicRoot;
      if (SKIP.has(id)) continue;
      if (id === '31' && platform !== 'button') continue;
      cmps[uid] = { id, uid, platform, topicRoot, name: c.name, min: c.min, max: c.max, step: c.step, unit: c.unit_of_measurement, options: c.options,
                    payload_on: c.payload_on ?? 'ON', payload_off: c.payload_off ?? 'OFF', payload_press: c.payload_press, topic: c.command_topic };
    }
    const before = Object.keys(state.cmps).length;
    state.cmps = cmps; render();

  }
  const cmpOf = id => Object.values(state.cmps).find(c => c.id === id);
  const L = id => { const v = I18N[lang]['L.' + id] ?? I18N.en['L.' + id]; return Array.isArray(v) ? v : null; };

  const hhmm = v => { const n = parseInt(v, 10); if (isNaN(n)) return v; return String(Math.floor(n / 100)).padStart(2, '0') + ':' + String(n % 100).padStart(2, '0'); };
  function fmtValue(id, raw) {
    const c = cmpOf(id); if (raw == null) return '–';
    if (/_time$/.test(id)) return /^\d+$/.test(raw) ? hhmm(raw) : raw;
    if (/_mode$/.test(id)) return modeText(raw);
    if (c?.platform === 'switch') return raw === c.payload_on ? t('on').toLowerCase() : raw === c.payload_off ? t('off').toLowerCase() : raw;

    if (wasPending) log(`✔ ${labelOf(id)} ${t('log.confirmed')}: ${fmtValue(id, raw)}`, 'log-ok');
  }

  // ------------------------------------------------------------------ Senden / send
  function send(id, payload, opts = {}) {
    const c = cmpOf(id); if (!c) return;

    const isButton = c.platform === 'button';
    if (!isButton) { state.pending[id] = payload; updateValue(id); }
    client.publish(c.topic, String(payload), { qos: 0 });
    log(`→ ${labelOf(id)}${isButton ? '' : ' = ' + payload}   (${c.topic.replace(BASE + '/', '')})`, 'log-tx');
    if (!isButton) setTimeout(() => { if (state.pending[id] === payload) { delete state.pending[id]; updateValue(id); log(`⚠ ${labelOf(id)}: ${t('log.noconfirm')}`, 'log-err'); } }, 15000);
  }
  function readAll() {

    if (/_time$/.test(c.id)) { const [h, m] = v.split(':').map(Number); if (isNaN(h) || isNaN(m)) return null; return c.platform === 'time' ? `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}` : String(h * 100 + m); }

    const row = document.createElement('div'); row.className = 'row'; const danger = DANGER.has(c.id);

  // ------------------------------------------------------------------ Betriebsmodus / operating mode

    for (const n of ids) {
      const st = state.values[`slot${n}_start_time`], en = state.values[`slot${n}_end_time`], on = state.values[`slot${n}_enabled`];
      if (on === 'ON' && (st === '0' || st === '00:00') && (en === '2359' || en === '23:59')) return n;
    }
    return ids.includes('1') ? '1' : ids[0];
  }
  function renderModeControl() {
    const g = document.getElementById('mode-grid'); g.innerHTML = '';
    const n = allDaySlot(); if (!n) { g.innerHTML = `<div class="muted">${t('mode.noslot')}</div>`; return; }
    const c = cmpOf(`slot${n}_mode`); if (!c) return;
    const box = document.createElement('div'); box.className = 'ctl';
    const top = document.createElement('div'); top.className = 'top';
    const lab = document.createElement('label'); lab.textContent = `${t('mode.label')} (Slot ${n})`; top.append(lab, curSpan(c.id)); box.appendChild(top);
    const d = document.createElement('div'); d.className = 'desc'; d.id = 'mode-reported'; box.appendChild(d);
    const row = document.createElement('div'); row.className = 'row';
    for (const [v, txt] of Object.entries(t('modes'))) { const b = document.createElement('button'); b.dataset.modeBtn = v; b.textContent = txt; b.onclick = () => send(c.id, modePayload(c, v)); row.appendChild(b); }
    box.appendChild(row); g.appendChild(box); updateModeControl();
  }
  function updateModeControl() {
    const n = allDaySlot(); const cur = state.values[`slot${n}_mode`]; const key = MODE_EN[cur] ?? String(cur);
    for (const b of document.querySelectorAll('[data-mode-btn]')) b.className = b.dataset.modeBtn === key ? 'primary' : '';
    const rep = document.getElementById('mode-reported'); if (rep && state.st) rep.textContent = `${t('mode.desc')}: ${modeText(state.st.workMode)}`;
  }

  // ------------------------------------------------------------------ Gerät, Packs, Dongle, Cloud (Anzeige)
  const kv = (k, v, small) => `<div class="kv"><div class="k">${k}</div><div class="v${small ? ' small' : ''}">${v ?? '–'}</div></div>`;
  const num = (v, d = 1) => (v == null || isNaN(v)) ? '–' : Number(v).toFixed(d);
  function onState(device, st, rerender = false) {
    state.st = st;
    if (!rerender) {
      if (state.lastStatus !== null && st.totalBatteryPackChargingStatus !== state.lastStatus) log(`${t('log.status')}: ${statusText(st.totalBatteryPackChargingStatus)} (${st.totalBatteryPackChargingPower} W)`, 'log-info');
      if (state.lastMode !== null && st.workMode !== state.lastMode) log(`${t('log.mode')}: ${modeText(st.workMode)}`, 'log-info');
      if (state.packs !== null && st.batteryPackageQuantity !== state.packs) log(`${t('log.packs')}: ${state.packs} → ${st.batteryPackageQuantity}`, 'log-info');
      state.lastStatus = st.totalBatteryPackChargingStatus; state.lastMode = st.workMode; state.packs = st.batteryPackageQuantity;
    }
    const fw = [1, 2, 3, 4].map(i => st[`fw_version_part_${i}`]).filter(x => x != null);
    document.getElementById('dev-info').innerHTML = [
      kv(t('dev.serial'), device), kv(t('dev.model'), 'Growatt NEXA 2000'), kv(t('dev.fw'), fw.length === 4 ? fw.map(Number).join('.') : '–'),
      kv(t('dev.mode'), modeText(st.workMode)), kv(t('dev.systemp'), num(st.systemTemp) + ' °C'), kv(t('dev.packs'), st.batteryPackageQuantity ?? '–'),
      kv(t('dev.soc'), num(st.totalBatteryPackSoc, 0) + ' %'),
      kv(t('dev.pv'), `${[1, 2, 3, 4].filter(i => Number(st[`pv${i}Voltage`]) > 15).length} / 4`),
      kv(t('dev.pvdetail'), [1, 2, 3, 4].map(i => `${i}: ${Number(st[`pv${i}Voltage`]) > 15 ? num(st[`pv${i}Voltage`]) + ' V' : t('pv.free')}`).join(' · '), true),
      kv(t('dev.last'), new Date().toLocaleTimeString(lang === 'de' ? 'de-DE' : 'en-GB'), true),
    ].join('');
    const n = Math.max(1, Number(st.batteryPackageQuantity) || 1); const rows = [];
    for (let i = 1; i <= n; i++) {
      const soc = st[`battery${i}Soc`], tp = st[`battery${i}Temp`];
      const serial = i === 1 ? device : (st[`bat${i}_serial`] || [1, 2, 3, 4].map(k => st[`bat${i}_ser_part_${k}`] || '').join('') || '–');
      const cells = i === 1 ? `${num(st.minCellVoltage, 3)} V / ${num(st.maxCellVoltage, 3)} V` : '–';
      rows.push(`<tr><td class="slotno">${i} (${i === 1 ? t('packs.main') : t('packs.ext')})<div class="muted" style="font-weight:400">${serial}</div></td><td>${num(soc, 0)} %</td><td>${tp != null ? num(tp) + ' °C' : '–'}</td><td>${cells}</td><td>${i === 1 ? (st.batteryCycles ?? '–') : '–'}</td><td>${i === 1 ? num(st.batterySoh, 0) + ' %' : '–'}</td></tr>`);
    }
    for (let i = n + 1; i <= 4; i++) if (Number(st[`battery${i}Soc`]) > 0) rows.push(`<tr><td class="slotno">${i} (${t('packs.reported')})</td><td>${num(st[`battery${i}Soc`], 0)} %</td><td>–</td><td>–</td><td>–</td><td>–</td></tr>`);
    document.getElementById('packs').innerHTML = rows.join('');
    updateModeControl();
    for (let i = 1; i <= 4; i++) { const el = document.getElementById(`site-s${i}-now`); if (!el) continue; const v = Number(st[`pv${i}Voltage`]), a = Number(st[`pv${i}Current`]);
      el.textContent = v > 15 ? `${(v * a).toFixed(0)} W · ${v.toFixed(1)} V` : t('site.free'); el.style.color = v > 15 ? 'var(--accent)' : 'var(--muted)'; }
  }
  function onDongle(d, rerender = false) {
    if (!rerender && (!state.dongle || state.dongle.received_at !== d.received_at)) log(`${t('log.dongle')}: ${d.model_id} SW ${d.sw_version}, Wi-Fi ${d.wifi_signal} dBm`, 'log-info');
    state.dongle = d;
    document.getElementById('dongle-info').innerHTML = [
      kv(t('dg.model'), d.model_id), kv(t('dg.sw'), d.sw_version), kv(t('dg.hw'), d.hw_version), kv(t('dg.type'), `${d.device_type ?? '–'} / ${d.protocol_version ?? '–'}`),
      kv(t('dg.wifi'), d.wifi_signal != null ? `${d.wifi_signal} dBm` : '–'), kv(t('dg.broker'), `${d.remote_url ?? '–'}:${d.remote_port ?? '–'}`, true), kv(t('dg.dns'), d.dns_address, true),
      kv(t('dg.tz'), `${d.timezone ?? '–'} · ${d.datetime ?? '–'}`, true), kv(t('dg.interval'), (d.data_interval ?? state.values['4']) != null ? `${d.data_interval ?? state.values['4']} min` : '–'),
      kv(t('dg.mac'), d.mac_address, true), kv(t('dg.ip'), `${d.local_ip ?? '–'} ${t('dg.ipnote')}`, true), kv(t('dg.received'), d.received_at, true),
    ].join('');
  }
  let cloudPending = null;
  function onCloudState(s, rerender = false) {
    const on = s === 'ON'; const el = document.getElementById('cloud-state');
    if (!rerender) { if (cloudPending !== null && on === cloudPending) cloudPending = null; if (state.cloudState !== null && state.cloudState !== s) log(`${t('log.cloudset')}: ${on ? t('on') : t('off')}`, 'log-cloud'); }
    state.cloudState = s;
    el.textContent = on ? t('on').toLowerCase() : t('off').toLowerCase(); el.className = 'cur' + (cloudPending !== null ? ' pending' : '');
    document.getElementById('cloud-on').className = 'b-on ' + (on ? 'on' : ''); document.getElementById('cloud-off').className = 'b-off ' + (!on ? 'off' : '');
  }
  function onCloudStatus(st, rerender = false) {
    const prev = state.cloud; state.cloud = st;
    if (!rerender && prev) {
      if (st.cloud_connected > prev.cloud_connected) log(`${t('log.cloudconn')} ${st.cloud_host}`, 'log-cloud');
      if (st.cloud_connected < prev.cloud_connected) log(t('log.cloudlost'), 'log-cloud');
      if (st.blocked_config_writes > prev.blocked_config_writes) log(`⚠ ${t('log.blocked')} ${st.blocked_config_writes})`, 'log-err');
      if (st.last_error && st.last_error !== prev.last_error) log(`${t('log.clouderr')}: ${st.last_error}`, 'log-err');
    }
    const kb = n => (n / 1024).toFixed(1) + ' KB';
    document.getElementById('cloud-status').innerHTML = [`${t('cloud.conns')}: ${st.connections}`, `${t('cloud.tocloud')}: ${st.cloud_connected}${st.cloud_host ? ' (' + st.cloud_host + ')' : ''}`,
      `${t('cloud.bytes')}: ${kb(st.bytes_up)} / ${kb(st.bytes_down)}`, `${t('cloud.blocked')}: ${st.blocked_config_writes}`,
      st.last_error ? `<span style="color:var(--red)">${t('error')}: ${st.last_error}</span>` : '', `${t('cloud.since')} ${st.since}`].filter(Boolean).join('<br>');
  }
  const cloudSet = on => { cloudPending = on; const el = document.getElementById('cloud-state'); el.textContent = t('setting'); el.className = 'cur pending';
    client.publish(`${BASE}/switch/grobro/cloud_forward/set`, on ? 'ON' : 'OFF'); log(`→ ${t('log.cloudset')} ${on ? t('on').toUpperCase() : t('off').toUpperCase()}`, 'log-tx'); };
  document.getElementById('cloud-on').onclick = () => cloudSet(true);
  document.getElementById('cloud-off').onclick = () => { if (confirm(t('cloud.confirmoff'))) cloudSet(false); };

  // ------------------------------------------------------------------ Standort und Module / location and panels
  const COMPASS = { N: 0, NE: 45, E: 90, SE: 135, S: 180, SW: 225, W: 270, NW: 315 };
  const $ = id => document.getElementById(id);
  const markDirty = () => { state.siteDirty = true; $('site-status').textContent = ''; };
  function renderSiteStrings() {
    const tb = $('site-strings'); const keep = {}; for (let i = 1; i <= 4; i++) keep[i] = { tilt: $(`site-s${i}-tilt`)?.value, az: $(`site-s${i}-az`)?.value, wp: $(`site-s${i}-wp`)?.value };
    tb.innerHTML = [1, 2, 3, 4].map(i => `<tr><td class="slotno">${i}</td>
      <td><input type="number" id="site-s${i}-tilt" min="0" max="90" step="1" placeholder="–"></td>
      <td class="az"><input type="number" id="site-s${i}-az" min="0" max="359" step="1" placeholder="–"><select id="site-s${i}-dir" title="N / NE / E …"><option value="">…</option>${Object.keys(COMPASS).map(k => `<option value="${k}">${t('compass')[k]}</option>`).join('')}</select></td>
      <td><input type="number" id="site-s${i}-wp" min="0" max="5000" step="5" placeholder="–"></td>
      <td id="site-s${i}-now" class="muted">–</td><td id="site-s${i}-fit" class="muted">–</td></tr>`).join('');
    for (let i = 1; i <= 4; i++) {
      if (keep[i].tilt != null) { $(`site-s${i}-tilt`).value = keep[i].tilt; $(`site-s${i}-az`).value = keep[i].az; $(`site-s${i}-wp`).value = keep[i].wp; }
      $(`site-s${i}-dir`).onchange = e => { if (e.target.value) { $(`site-s${i}-az`).value = COMPASS[e.target.value]; markDirty(); } };
      for (const k of ['tilt', 'az', 'wp']) $(`site-s${i}-${k}`).oninput = markDirty;
    }
    if (state.st) onState(state.device, state.st, true);
    if (state.fit) onFit(state.fit, true);
  }
  renderSiteStrings();
  let fitPending = false;
  const compassName = az => { const keys = Object.keys(COMPASS); return t('compass')[keys[Math.round(((az % 360) + 360) % 360 / 45) % 8]]; };
  function onFit(f, rerender = false) {
    if (!rerender && state.fit && state.fit.updated !== f.updated) log(`${t('log.fit')}`, 'log-info');
    state.fit = f; fitPending = false;
    $('fit-status').textContent = `${t('fit.last')} ${new Date(f.updated * 1000).toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB')} · ${f.days} ${t('fit.days')}. ${t('fit.hint')}`;
    for (let i = 1; i <= 4; i++) {
      const v = (f.strings || {})[String(i)]; const el = $(`site-s${i}-fit`); if (!el) continue;
      if (!v || v.status === 'unused') { el.textContent = t('fit.unused'); el.className = 'muted'; continue; }
      if (v.status === 'insufficient') { el.textContent = `${t('fit.insufficient')} (${v.hours ?? 0} ${t('fit.hours')})`; el.className = 'muted'; continue; }
      el.className = ''; el.innerHTML = '';
      const txt = document.createElement('span'); txt.style.color = v.status === 'ok' ? 'var(--green)' : 'var(--orange)';
      txt.textContent = `${compassName(v.azimuth)} ${v.azimuth}° / ${v.tilt}° / ${v.wp} Wp · R² ${v.r2.toFixed(2)} (${t('fit.' + v.status)}, ${v.hours} ${t('fit.hours')})`;
      txt.title = `${t('site.azimuth')} ${v.az_range[0]}–${v.az_range[1]}°, ${t('site.tilt')} ${v.tilt_range[0]}–${v.tilt_range[1]}°`;
      const b = document.createElement('button'); b.textContent = t('fit.apply'); b.style.marginLeft = '6px'; b.style.padding = '2px 8px';
      b.onclick = () => { $(`site-s${i}-tilt`).value = v.tilt; $(`site-s${i}-az`).value = v.azimuth; if (!$(`site-s${i}-wp`).value) $(`site-s${i}-wp`).value = v.wp; markDirty(); };
      el.appendChild(txt); el.appendChild(b);
    }
  }
  $('fit-run').onclick = () => { fitPending = true; client.publish(`${BASE}/grolo/fit/run`, '1'); $('fit-status').textContent = t('fit.running'); log(`→ ${t('log.fitrun')}`, 'log-tx'); };
  for (const id of ['site-lat', 'site-lon']) $(id).oninput = () => { markDirty(); $('site-q').dataset.name = ''; };
  function onSiteConfig(cfg, rerender = false) {
    state.site = cfg;
    $('site-cur').textContent = cfg.name ? `${cfg.name} (${Number(cfg.lat).toFixed(3)}, ${Number(cfg.lon).toFixed(3)})` : `${Number(cfg.lat).toFixed(3)}, ${Number(cfg.lon).toFixed(3)}`; $('site-cur').className = 'cur';
    if (state.siteDirty && !rerender) return;   // eigene Eingabe nicht überschreiben
    $('site-lat').value = cfg.lat ?? ''; $('site-lon').value = cfg.lon ?? ''; $('site-q').value = cfg.name || ''; $('site-q').dataset.name = cfg.name || '';
    for (let i = 1; i <= 4; i++) { const c = (cfg.strings || {})[String(i)] || {}; $(`site-s${i}-tilt`).value = c.tilt ?? ''; $(`site-s${i}-az`).value = c.azimuth ?? ''; $(`site-s${i}-wp`).value = c.wp || ''; }
  }
  function onWeatherCurrent(w) {
    state.wx = w;
    const site = w.site || {}; const strs = Object.entries(w.strings || {}).map(([k, c]) => `${k}: ${Number(c.tilt).toFixed(0)}°/${Number(c.azimuth).toFixed(0)}°${c.wp ? '/' + Number(c.wp).toFixed(0) + ' Wp' : ''}`).join(', ');
    $('site-sun').innerHTML = [w.sun_azimuth != null ? `${t('site.azimuthNow')} ${Number(w.sun_azimuth).toFixed(1)}° · ${t('site.elevationNow')} ${Number(w.sun_elevation).toFixed(1)}°` : '',
      `${t('site.uses')}: ${site.name ? site.name + ' ' : ''}${site.lat != null ? '(' + Number(site.lat).toFixed(3) + ', ' + Number(site.lon).toFixed(3) + ')' : (w.latitude ?? '–') + ', ' + (w.longitude ?? '–')}${strs ? ' · ' + strs : ''}`,
      `${w.condition_de && lang === 'de' ? w.condition_de : (w.condition_en || '')} ${w.temperature != null ? w.temperature + ' °C' : ''} · ${w.shortwave_radiation ?? '–'} W/m²`].filter(Boolean).join('<br>');
    if (!state.site && !state.siteDirty && site.lat != null) { $('site-lat').value = site.lat; $('site-lon').value = site.lon; }
  }
  async function siteSearch() {
    const q = $('site-q').value.trim(); if (!q) return;
    const sel = $('site-results'); sel.hidden = true; $('site-status').textContent = '…';
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=${lang}&format=json`);
      const d = await r.json(); const res = d.results || [];
      if (!res.length) { $('site-status').textContent = t('site.nohit'); return; }
      sel.innerHTML = res.map((x, i) => `<option value="${i}">${[x.name, x.postcodes?.[0], x.admin1, x.country].filter(Boolean).join(', ')} (${x.latitude.toFixed(3)}, ${x.longitude.toFixed(3)})</option>`).join('');
      sel.hidden = false; $('site-status').textContent = '';
      const pick = () => { const x = res[Number(sel.value)]; $('site-lat').value = x.latitude.toFixed(4); $('site-lon').value = x.longitude.toFixed(4); $('site-q').dataset.name = [x.postcodes?.[0], x.name].filter(Boolean).join(' '); markDirty(); };
      sel.onchange = pick; pick();
    } catch (e) { $('site-status').textContent = t('site.searcherr'); }
  }
  $('site-search').onclick = siteSearch; $('site-q').onkeydown = e => { if (e.key === 'Enter') siteSearch(); };
  $('site-save').onclick = () => {
    const lat = parseFloat($('site-lat').value), lon = parseFloat($('site-lon').value);
    if (isNaN(lat) || isNaN(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) { $('site-status').textContent = t('site.invalid'); return; }
    const strings = {};
    for (let i = 1; i <= 4; i++) { const tilt = parseFloat($(`site-s${i}-tilt`).value), az = parseFloat($(`site-s${i}-az`).value), wp = parseFloat($(`site-s${i}-wp`).value);
      if (!isNaN(tilt) && !isNaN(az)) strings[i] = { tilt, azimuth: az, wp: isNaN(wp) ? 0 : wp }; }
    const cfg = { name: $('site-q').dataset.name || $('site-q').value.trim(), lat, lon, strings, updated: Math.floor(Date.now() / 1000) };
    client.publish(`${BASE}/grolo/config/site`, JSON.stringify(cfg), { qos: 0, retain: true });
    state.siteDirty = false; $('site-status').textContent = t('site.saved'); log(`→ ${t('log.site')}: ${cfg.name || ''} (${lat}, ${lon}), ${Object.keys(strings).length} Strings`, 'log-tx');
  };
})();
</script>
</body>
</html>
