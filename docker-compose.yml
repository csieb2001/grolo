# Growatt NEXA 2000 – lokales Setup ohne Hersteller-Cloud
#
#   Dongle ──TLS 7006──▶ mosquitto ──▶ GroBro ──▶ mosquitto ──plain 1883──▶ mosquitto_sub / Home Assistant
#
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: grolo-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PLAIN_PORT:-1883}:1883"   # Plain-Listener (Ziel)
      - "${MQTT_TLS_PORT:-7006}:7006"     # TLS-Listener (Growatt-Dongle)
      - "${MQTT_WS_PORT:-9001}:9001"      # Websockets (Einstellungsseite)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 5s

  grobro:
    image: ghcr.io/robertzaage/grobro:latest
    container_name: grolo-grobro
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      # Quelle: TLS-Listener (GroBro validiert das Zertifikat nicht, nur der Dongle tut das)
      SOURCE_MQTT_HOST: mosquitto
      SOURCE_MQTT_PORT: "7006"
      SOURCE_MQTT_TLS: "true"
      # Ziel: Plain-Listener
      TARGET_MQTT_HOST: mosquitto
      TARGET_MQTT_PORT: "1883"
      TARGET_MQTT_TLS: "false"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
      # Cloud-Weiterleitung läuft über den schaltbaren Dienst cloud-gate (Schalter auf der Einstellungsseite).
      # GroBro glaubt, mit mqtt.growatt.com zu sprechen; cloud-gate reicht durch oder schluckt.
      GROWATT_CLOUD: "true"
      GROWATT_CLOUD_CONFIG_FILTER: "true"
      FORWARD_MQTT_HOST: cloud-gate
      FORWARD_MQTT_PORT: "7006"
      LOG_LEVEL: "${GROBRO_LOG_LEVEL:-INFO}"
      DUMP_MESSAGES: "${GROBRO_DUMP_MESSAGES:-false}"
      DEVICE_TIMEOUT: "${GROBRO_DEVICE_TIMEOUT:-300}"
      MAX_SLOTS: "${GROBRO_MAX_SLOTS:-1}"
      MAX_BAT: "auto"
      TZ: "${TZ:-Europe/Berlin}"
      # Hinweis: REGISTER_FILTER ist seit GroBro 1.7.4 entfernt – die Register-Map
      # (NEXA/NOAH/NEO/...) wird automatisch anhand der Seriennummer erkannt.
    volumes:
      - ./grobro/dump:/dump
      # Register-Map aus dem main-Branch (ergänzt Firmware-Register 119/120 und WLAN-Signal), Image :latest hinkt hinterher.
      # Entfernen, sobald ein neues Image die Felder mitbringt.
      - ./grobro/registers/growatt_nexa_registers.json:/app/grobro/model/growatt_nexa_registers.json:ro

  # Sidecar: Dongle-Konfiguration (FE19) dekodieren und retained veröffentlichen (GroBro :latest kann das für NEXA nicht)
  dongle-info:
    image: ghcr.io/robertzaage/grobro:latest
    container_name: grolo-dongle-info
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    entrypoint: ["python", "/sidecar/dongle_info.py"]
    working_dir: /app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
      DUMP_DIR: /dump
      PYTHONPATH: /app
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./grobro/sidecar:/sidecar:ro
      - ./grobro/dump:/dump:ro

  # Sidecar: alle Rohregister (auch unbekannte) als JSON veröffentlichen, nur lesend (Forschungswerkzeug)
  raw-registers:
    image: ghcr.io/robertzaage/grobro:latest
    container_name: grolo-raw-registers
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    entrypoint: ["python", "/sidecar/raw_registers.py"]
    working_dir: /app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
      ONLY_UNKNOWN: "true"
      PYTHONPATH: /app
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./grobro/sidecar:/sidecar:ro
      - ./grobro/registers/growatt_nexa_registers.json:/app/grobro/model/growatt_nexa_registers.json:ro

  # Schaltbare Weiterleitung zur Growatt-Cloud (TLS-Relay mit Konfig-Filter), Steuerung per MQTT
  cloud-gate:
    image: ghcr.io/robertzaage/grobro:latest
    container_name: grolo-cloud-gate
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    entrypoint: ["python", "/sidecar/cloud_gate.py"]
    working_dir: /app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
      CLOUD_HOSTS: "${CLOUD_HOSTS:-8.209.71.240,47.254.130.145}"   # IPs, nicht der Name: mqtt.growatt.com zeigt im LAN auf den Mac
      CLOUD_SNI: mqtt.growatt.com
      CLOUD_VERIFY: "true"
      CONFIG_FILTER: "true"
      PYTHONPATH: /app
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./grobro/sidecar:/sidecar:ro
      - ./mosquitto/certs:/certs:ro
      - ./grobro/dump:/dump          # Cloud-Befehle an das Gerät als Dateien (cloud_down/)
      - cloud-gate-state:/state

  # Push der bereinigten Messwerte an die GroLo-Website (Vercel), nur wenn WEB_URL/WEB_TOKEN gesetzt sind
  web-push:
    image: ghcr.io/robertzaage/grobro:latest
    container_name: grolo-web-push
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    entrypoint: ["python", "/sidecar/web_push.py"]
    working_dir: /app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
      WEB_URL: "${WEB_URL:-}"
      WEB_TOKEN: "${WEB_TOKEN:-}"
      PUSH_INTERVAL: "${WEB_PUSH_INTERVAL:-30}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./grobro/sidecar:/sidecar:ro
      - web-push-state:/state          # ungesendete Samples überleben einen Neustart

  # Nulleinspeisung ("Smart"-Modus) mit einem Shelly-Zähler, lokal ohne Growatt-Cloud
  shelly-control:
    image: ghcr.io/robertzaage/grobro:latest
    container_name: grolo-shelly-control
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    entrypoint: ["python", "/sidecar/shelly_control.py"]
    working_dir: /app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
      INFLUX_URL: "http://influxdb:8086"
      INFLUX_TOKEN: "${INFLUX_TOKEN}"
      INFLUX_ORG: "${INFLUX_ORG:-growatt}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-nexa}"
      SHELLY_HTTP_TIMEOUT: "${SHELLY_HTTP_TIMEOUT:-2}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./grobro/sidecar:/sidecar:ro

  # Wetter für den Anlagenstandort (Open-Meteo, kostenlos, ohne Schlüssel): aktuell + 48 h Vorhersage
  weather:
    image: ghcr.io/robertzaage/grobro:latest
    container_name: grolo-weather
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    entrypoint: ["python", "/sidecar/weather.py"]
    working_dir: /app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
      WEATHER_LAT: "${WEATHER_LAT:-}"
      WEATHER_LON: "${WEATHER_LON:-}"
      WEATHER_INTERVAL: "${WEATHER_INTERVAL:-600}"
      WEATHER_NAME: "${WEATHER_NAME:-}"
      STRING1_TILT: "${STRING1_TILT:-}"
      STRING1_AZIMUTH: "${STRING1_AZIMUTH:-}"
      STRING1_WP: "${STRING1_WP:-}"
      STRING2_TILT: "${STRING2_TILT:-}"
      STRING2_AZIMUTH: "${STRING2_AZIMUTH:-}"
      STRING2_WP: "${STRING2_WP:-}"
      STRING3_TILT: "${STRING3_TILT:-}"
      STRING3_AZIMUTH: "${STRING3_AZIMUTH:-}"
      STRING3_WP: "${STRING3_WP:-}"
      STRING4_TILT: "${STRING4_TILT:-}"
      STRING4_AZIMUTH: "${STRING4_AZIMUTH:-}"
      STRING4_WP: "${STRING4_WP:-}"
      STRING_PR: "${STRING_PR:-0.85}"
      FIT_INTERVAL: "${FIT_INTERVAL:-86400}"
      FIT_DAYS: "${FIT_DAYS:-30}"
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: "${INFLUX_TOKEN}"
      INFLUX_ORG: "${INFLUX_ORG:-growatt}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-nexa}"
      PYTHONPATH: /app
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./grobro/sidecar:/sidecar:ro

  # Jahresprognose: rechnet ein volles Jahr Stunde für Stunde mit dem echten Wetter des Standorts durch und
  # sagt, wie viel Strom zusammenkommt, was die Jahresrechnung kostet und welcher Abschlag richtig wäre.
  forecast:
    image: ghcr.io/robertzaage/grobro:latest
    container_name: grolo-forecast
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    entrypoint: ["python", "/sidecar/forecast.py"]
    working_dir: /app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
      FORECAST_INTERVAL: "${FORECAST_INTERVAL:-21600}"
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: "${INFLUX_TOKEN}"
      INFLUX_ORG: "${INFLUX_ORG:-growatt}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-nexa}"
      PYTHONPATH: /app
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./grobro/sidecar:/sidecar:ro

  # ---------------- tado X (Matter over Thread, lokal) ----------------
  # tado bietet für die X-Reihe kein lokales HTTP-API; der lokale Weg ist Matter. Dieser Dienst ist ein
  # vollwertiger Matter-Controller (Open Home Foundation, auf matter.js) mit WebSocket-Schnittstelle auf
  # Port 5580 – dieselbe API, die Home Assistant benutzt. Er braucht das Netz des Hosts, weil Matter über
  # mDNS findet und über IPv6 spricht: die Geräte hängen im Thread-Mesh und sind nur über die Route
  # erreichbar, die der Border Router per Router Advertisement ankündigt.
  matter:
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: grolo-matter
    restart: unless-stopped
    profiles: ["tado"]
    network_mode: host
    security_opt:
      - apparmor=unconfined
    environment:
      LOG_LEVEL: "${MATTER_LOG_LEVEL:-info}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - matter-data:/data

  # Übersetzt zwischen dem Matter-Controller und dem GroLo-Stack: liest je Raum Ist- und Solltemperatur,
  # Betriebsart, Luftfeuchte, Ventilstellung und Batterie, und nimmt Schreibaufträge der Bedienseite entgegen.
  tado-bridge:
    image: ghcr.io/robertzaage/grobro:latest
    container_name: grolo-tado-bridge
    restart: unless-stopped
    profiles: ["tado"]
    depends_on:
      mosquitto:
        condition: service_healthy
    entrypoint: ["python", "/sidecar/tado_bridge.py"]
    working_dir: /app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
      MATTER_URL: "${MATTER_URL:-ws://host.docker.internal:5580/ws}"
      TADO_INTERVAL: "${TADO_INTERVAL:-30}"
      PYTHONPATH: /app
      TZ: "${TZ:-Europe/Berlin}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./grobro/sidecar:/sidecar:ro

  # Verschiebt Heizwärme in die Sonnenstunden: hebt die Solltemperatur bei PV-Überschuss um ein halbes
  # Grad an und nimmt sie danach zurück. Standardmäßig aus; eingeschaltet wird auf der Einstellungsseite.
  heat-shift:
    image: ghcr.io/robertzaage/grobro:latest
    container_name: grolo-heat-shift
    restart: unless-stopped
    profiles: ["tado"]
    depends_on:
      mosquitto:
        condition: service_healthy
    entrypoint: ["python", "/sidecar/heat_shift.py"]
    working_dir: /app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
      HEATSHIFT_INTERVAL: "${HEATSHIFT_INTERVAL:-120}"
      HEATSHIFT_STATE: /state/heatshift.json
      PYTHONPATH: /app
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./grobro/sidecar:/sidecar:ro
      - heatshift-state:/state          # Ausgangs-Sollwerte überleben einen Neustart

  # ---------------- Wärmepumpe (WOLF Link, lokal) ----------------
  # ism7mqtt spricht das ISM7-Protokoll direkt mit dem WOLF Link (TLS auf Port 9092) und veröffentlicht
  # je Busteilnehmer ein JSON-Topic Wolf/<ip>/<Gerät>_<Bus>. Kein Wolf-Cloud-Portal beteiligt.
  # Der Link nimmt nur eine lokale Verbindung an: solange dieser Dienst läuft, kann die Smartset-App
  # nicht mehr lokal direkt verbinden (über das Portal funktioniert sie weiter).
  # Beide Dienste starten nur mit COMPOSE_PROFILES=wolf in der .env.
  wolf:
    image: zivillian/ism7mqtt:latest
    container_name: grolo-wolf
    restart: unless-stopped
    profiles: ["wolf"]
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      ISM7_IP: "${WOLF_HOST}"
      ISM7_PASSWORD: "${WOLF_PASSWORD}"
      ISM7_MQTTHOST: mosquitto
      ISM7_MQTTPORT: "1883"
      ISM7_INTERVAL: "${WOLF_INTERVAL:-30}"
      ISM7_LANGUAGE: DEU              # Klartexte kommen deutsch; die englischen stehen im Katalog
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      # Von scripts/wolf-config.sh erzeugt: welche Busteilnehmer die Anlage hat und welche Parameter je Teilnehmer
      - ./wolf/parameter.json:/app/parameter.json:ro

  # Übersetzt die Wolf-Topics in flache Zustände für Telegraf, rechnet COP/Taktung/Arbeitszahlen
  # und nimmt Schreibaufträge der Bedienseite entgegen (siehe grobro/sidecar/wolf_bridge.py)
  wolf-bridge:
    image: ghcr.io/robertzaage/grobro:latest
    container_name: grolo-wolf-bridge
    restart: unless-stopped
    profiles: ["wolf"]
    depends_on:
      mosquitto:
        condition: service_healthy
    entrypoint: ["python", "/sidecar/wolf_bridge.py"]
    working_dir: /app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
      WOLF_CATALOG: /wolf/catalog.json
      WOLF_STATE: /state/wolf.json
      WOLF_PUBLISH_INTERVAL: "${WOLF_PUBLISH_INTERVAL:-10}"
      # Fachmann-Ebene: dieselbe Idee wie der Fachmann-Code der Smartset-App. Leer = kein Code nötig.
      WOLF_EXPERT_PIN: "${WOLF_EXPERT_PIN:-}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./grobro/sidecar:/sidecar:ro
      - ./wolf:/wolf:ro
      - wolf-state:/state                # Tageszähler (Takte, Laufzeiten) überleben einen Neustart

  # ---------------- Datenbank + Dashboard ----------------
  influxdb:
    image: influxdb:2.7
    container_name: grolo-influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"          # Admin-UI/API nur lokal
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: "${INFLUX_ADMIN_USER:-admin}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUX_ADMIN_PASSWORD}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUX_ORG:-growatt}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUX_BUCKET:-nexa}"
      DOCKER_INFLUXDB_INIT_RETENTION: "0"   # unbegrenzt aufbewahren
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUX_TOKEN}"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  telegraf:
    image: telegraf:1.32
    container_name: grolo-telegraf
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      INFLUX_TOKEN: "${INFLUX_TOKEN}"
      INFLUX_ORG: "${INFLUX_ORG:-growatt}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-nexa}"
      HA_BASE_TOPIC: "${HA_BASE_TOPIC:-homeassistant}"
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grolo-grafana
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # Ansehen im LAN ohne Login, Bearbeiten nur als admin
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nexa-en.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      INFLUX_TOKEN: "${INFLUX_TOKEN}"
      INFLUX_ORG: "${INFLUX_ORG:-growatt}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-nexa}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./settings-ui:/usr/share/grafana/public/grolo:ro   # Einstellungsseite auch unter Grafana /public/grolo/ (Dashboard-Link)

  # Einstellungsseite: statische Seite, spricht per Websocket direkt mit Mosquitto (GroBro-Kommandotopics)
  settings:
    image: nginx:1.27-alpine
    container_name: grolo-settings
    restart: unless-stopped
    ports:
      - "${SETTINGS_PORT:-8080}:80"
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./settings-ui:/usr/share/nginx/html:ro
      # Websocket unter /mqtt am selben Hostnamen – die Seite braucht das, sobald sie über den Tunnel läuft
      - ./settings-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ---- Website und ihre Datenbank, seit dem Umzug von Vercel/Neon im eigenen Stack ----------------------
  # Beide laufen nur mit dem Profil "web" (COMPOSE_PROFILES in .env), damit der Stack ohne die
  # Website-Quellen im Nachbarordner startbar bleibt.

  # Postgres für die Website. Kein Host-Port: erreichbar nur im Compose-Netz, Zugriff von Hand per
  # docker exec -it grolo-db psql -U grolo. Die Zeitzone bleibt absichtlich UTC (Standard des Abbilds),
  # die Abfragen der Website setzen ihre Zeitzone selbst per AT TIME ZONE.
  grolo-db:
    image: postgres:18-alpine
    container_name: grolo-db
    restart: unless-stopped
    profiles: ["web"]
    environment:
      POSTGRES_DB: "${PGDATABASE:-grolo}"
      POSTGRES_USER: "${PGUSER:-grolo}"
      # Ohne PGPASSWORD startet der Container nicht – das Abbild lehnt ein leeres Superuser-Passwort ab.
      POSTGRES_PASSWORD: "${PGPASSWORD}"
    volumes:
      # Postgres 18 erwartet den Mount eine Ebene über dem Datenverzeichnis (PGDATA liegt darin unter
      # 18/docker); auf /var/lib/postgresql/data gemountet startet das Abbild nicht.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-grolo} -d ${PGDATABASE:-grolo}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Die Website selbst (Next.js, Quellen im Nachbarordner ../grolo-web). Ebenfalls ohne Host-Port:
  # von außen kommt man nur durch den Cloudflare-Tunnel, und der steht hinter Cloudflare Access.
  # Ohne SITE_PASSWORD zeigt die Seite keinen Login mehr – den Zugang regelt Access davor.
  grolo-web:
    build:
      context: ../grolo-web
    image: grolo-web:local
    container_name: grolo-web
    restart: unless-stopped
    profiles: ["web"]
    depends_on:
      grolo-db:
        condition: service_healthy
    ports:
      # Nur an den Rechner selbst gebunden, nicht ans Netz: zum Nachsehen per SSH-Weiterleitung
      # (ssh -L 3001:127.0.0.1:3001 root@<host>), ohne die Seite im LAN offen stehen zu lassen.
      - "127.0.0.1:${WEB_LOCAL_PORT:-3001}:3000"
    environment:
      DATABASE_URL: "postgres://${PGUSER:-grolo}:${PGPASSWORD}@grolo-db:5432/${PGDATABASE:-grolo}"
      INGEST_TOKEN: "${WEB_TOKEN}"
      SITE_PASSWORD: "${SITE_PASSWORD:-}"
      # Verweise auf die Nachbarseiten derselben Anlage. Leer lassen, wenn die Hostnamen dem Muster
      # <dienst>.<domain> folgen – dann leitet die Seite sie aus ihrer eigenen Adresse ab.
      LINK_SETTINGS: "${LINK_SETTINGS:-}"
      LINK_GRAFANA: "${LINK_GRAFANA:-}"
      LINK_HEATPUMP: "${LINK_HEATPUMP:-}"
      TZ: "${TZ:-Europe/Berlin}"

  # Cloudflare-Tunnel: baut die Verbindung von innen nach außen auf, deshalb keine Portfreigabe im
  # Router und kein DynDNS. Welche Hostnamen auf welchen Dienst zeigen, steht im Cloudflare-Dashboard
  # (Zero Trust -> Networks -> Tunnels), davor jeweils eine Access-Richtlinie.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: grolo-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN}"

volumes:
  mosquitto-data:
  influxdb-data:
  grafana-data:
  cloud-gate-state:
  web-push-state:
  pgdata:
  matter-data:
  heatshift-state:
  wolf-state:
