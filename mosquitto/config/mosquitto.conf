# Mosquitto für Growatt NEXA 2000 (GroBro-Setup)
# per_listener_settings MUSS vor dem ersten Listener stehen.
per_listener_settings true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ---------------------------------------------------------------
# Plain-Listener 1883 – Ziel für GroBro, mosquitto_sub, Home Assistant
# ---------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# ---------------------------------------------------------------
# TLS-Listener 7006 – Growatt-Dongle
# chain-full.pem = cert + intermediate (E6) + root (ISRG Root X2)
# Mosquitto sendet die komplette Datei als Chain, inkl. Root.
# Der Dongle meldet sich mit user=<Seriennummer> / pass=Growatt an,
# daher allow_anonymous true (keine Passwortdatei nötig).
# ---------------------------------------------------------------
listener 7006 0.0.0.0
protocol mqtt
allow_anonymous true
certfile /mosquitto/certs/chain-full.pem
keyfile  /mosquitto/certs/privkey.pem
cafile   /mosquitto/certs/root.pem
require_certificate false

# ---------------------------------------------------------------
# Websocket-Listener 9001 – Einstellungsseite im Browser (LAN)
# ---------------------------------------------------------------
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
