# Telegraf: GroBro-Statusnachrichten aus MQTT nach InfluxDB schreiben
[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grobro/+/state"]
  client_id = "telegraf-nexa"
  qos = 0
  data_format = "json_v2"

  # Seriennummer aus dem Topic als Tag "device"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_BASE_TOPIC}/grobro/+/state"
    tags  = "_/_/device/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "nexa"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      excluded_keys = ["ser_part_1", "ser_part_2", "ser_part_3", "ser_part_4"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# Dongle-Konfiguration (retained JSON vom Sidecar dongle-info) -> Measurement "dongle"
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grobro/+/dongle"]
  client_id = "telegraf-dongle"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_BASE_TOPIC}/grobro/+/dongle"
    tags  = "_/_/device/_"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "dongle"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "wifi_signal"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "sw_version"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "hw_version"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "model_id"

# Unbekannte Rohregister (Sidecar raw-registers) -> Measurements raw_input / raw_holding, Felder r<Nr>
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grobro/+/raw_input", "${HA_BASE_TOPIC}/grobro/+/raw_holding"]
  client_id = "telegraf-raw"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_BASE_TOPIC}/grobro/+/+"
    tags  = "_/_/device/kind"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "raw"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "registers"

# Wetter (Sidecar weather, Open-Meteo) -> Measurement "weather"
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grolo/weather/state"]
  client_id = "telegraf-weather"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "weather"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
