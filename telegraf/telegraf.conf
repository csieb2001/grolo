# Telegraf: GroBro-Statusnachrichten aus MQTT nach InfluxDB schreiben
[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grobro/+/state"]
  client_id = "telegraf-nexa"
  qos = 0
  data_format = "json_v2"

  # Seriennummer aus dem Topic als Tag "device"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_BASE_TOPIC}/grobro/+/state"
    tags  = "_/_/device/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "nexa"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      excluded_keys = ["ser_part_1", "ser_part_2", "ser_part_3", "ser_part_4"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# Dongle-Konfiguration (retained JSON vom Sidecar dongle-info) -> Measurement "dongle"
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grobro/+/dongle"]
  client_id = "telegraf-dongle"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_BASE_TOPIC}/grobro/+/dongle"
    tags  = "_/_/device/_"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "dongle"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "wifi_signal"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "sw_version"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "hw_version"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "model_id"

# Unbekannte Rohregister (Sidecar raw-registers) -> Measurements raw_input / raw_holding, Felder r<Nr>
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grobro/+/raw_input", "${HA_BASE_TOPIC}/grobro/+/raw_holding"]
  client_id = "telegraf-raw"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_BASE_TOPIC}/grobro/+/+"
    tags  = "_/_/device/kind"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "raw"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "registers"

# Wetter (Sidecar weather, Open-Meteo) -> Measurement "weather"
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grolo/weather/state"]
  client_id = "telegraf-weather"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "weather"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"

# Strompreis (retained JSON von der Einstellungsseite, <BASE>/grolo/config/tariff) -> Measurement "tariff"
# Wird beim Verbinden erneut geliefert (retained), Grafana liest den letzten Wert für die Kosten-Zeile.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grolo/config/tariff"]
  client_id = "telegraf-tariff"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "tariff"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "price_ct_kwh"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "feedin_ct_kwh"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "system_cost_eur"
      type = "float"
      optional = true

# String-Namen (retained JSON von der Einstellungsseite, <BASE>/grolo/config/string_names) -> Measurement "string_names"
# Grafana liest die letzten Werte in die Variablen s1..s4 (Standard "String n").
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grolo/config/string_names"]
  client_id = "telegraf-string-names"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "string_names"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "s1"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "s2"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "s3"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "s4"
      type = "string"

# Wärmepumpe: Zustand je Busteilnehmer vom Sidecar wolf-bridge -> Measurement "wolf", Tag "device"
# (heatpump, control, dhw, circuit, mixer, gateway). Die Klartextfelder "<feld>_text" bleiben draußen:
# in InfluxDB stehen die Zahlen, den Klartext bildet Grafana per Value-Mapping und die Bedienseite live ab.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grolo/wolf/+/state"]
  client_id = "telegraf-wolf"
  qos = 0
  data_format = "json_v2"
  fielddrop = ["*_text"]
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_BASE_TOPIC}/grolo/wolf/+/state"
    tags  = "_/_/_/device/_"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "wolf"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"

# Berechnete Kennzahlen (COP, Spreizung, Taktung, Arbeitszahlen) -> Measurement "wolf_derived"
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grolo/wolf/derived"]
  client_id = "telegraf-wolf-derived"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "wolf_derived"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"

# Ein Datensatz je beendetem Verdichterlauf -> Measurement "wolf_cycle". Erst damit lassen sich Verteilung der
# Laufzeiten, Pausen und die Abhängigkeit von der Außentemperatur auswerten; die Tageszähler in "wolf_derived"
# sagen nur, wie oft getaktet wurde, nicht wie. Die Betriebsart wird zum Tag, damit Heizen und Warmwasser
# in Grafana getrennt werden können.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grolo/wolf/cycle"]
  client_id = "telegraf-wolf-cycle"
  qos = 1
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "wolf_cycle"
    timestamp_path = "end"
    timestamp_format = "unix"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = ["mode"]
      excluded_keys = ["start", "end"]

# Jahresprognose (Sidecar forecast) -> Measurement "forecast". Nur die flachen Zahlen; die Monatszeilen
# schreibt das Sidecar selbst als "forecast_month" nach InfluxDB, weil sie eine Dimension mehr haben.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grolo/forecast/state"]
  client_id = "telegraf-forecast"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "forecast"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      # Güte bewusst als Feld, nicht als Tag: als Tag würde jede Änderung der Güte eine neue Zeitreihe
      # aufmachen, und last() lieferte danach zwei Werte je Kennzahl statt einem.

# tado X je Raum (Sidecar tado-bridge über den lokalen Matter-Controller) -> Measurement "tado", Tag "room"
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${HA_BASE_TOPIC}/grolo/tado/+/state"]
  client_id = "telegraf-tado"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_BASE_TOPIC}/grolo/tado/+/state"
    tags  = "_/_/_/room/_"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "tado"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
